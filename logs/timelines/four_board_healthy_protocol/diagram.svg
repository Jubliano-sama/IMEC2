<text x="202.0" y="668.5" class="tiny center" text-anchor="middle"><tspan x="202.0" dy="0.0">topology setup starts</tspan></text>
<text x="346.4" y="663.0" class="tiny center" text-anchor="middle"><tspan x="346.4" dy="0.0">first relay timing handshake</tspan><tspan x="346.4" dy="11.0">bounded</tspan></text>
<text x="490.7" y="693.0" class="tiny center" text-anchor="middle"><tspan x="490.7" dy="0.0">sequential depth-3 timing chain</tspan><tspan x="490.7" dy="11.0">bounded</tspan></text>
<text x="614.4" y="663.0" class="tiny center" text-anchor="middle"><tspan x="614.4" dy="0.0">assignment evidence expected</tspan><tspan x="614.4" dy="11.0">on healthy routes</tspan></text>
<text x="923.8" y="668.5" class="tiny center" text-anchor="middle"><tspan x="923.8" dy="0.0">normal click hard deadline</tspan></text>
<text x="1336.2" y="668.5" class="tiny center" text-anchor="middle"><tspan x="1336.2" dy="0.0">survey discovery executes</tspan></text>
<text x="1993.0" y="663.0" class="tiny center" text-anchor="middle"><tspan x="1993.0" dy="0.0">healthy three-pair survey</tspan><tspan x="1993.0" dy="11.0">target</tspan></text>
<text x="1050.0" y="753.0" class="caption center" text-anchor="middle"><tspan x="1050.0" dy="0.0">The one-time topology and timing negotiation precedes assignment. Normal clicks and surveys then reuse the same 1/2/3-hop routes; heartbeat has no reserved phase and is discarded whenever it cannot use an already-open slot.</tspan></text>
