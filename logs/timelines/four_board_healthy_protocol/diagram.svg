<svg xmlns="http://www.w3.org/2000/svg" width="2100" height="787" viewBox="0 0 2100 787" role="img">
<style>
svg { background: #ffffff; font-family: Arial, Helvetica, sans-serif; color: #111111; }
.title { font-size: 13px; font-weight: 700; }
.row-label { font-size: 13px; font-weight: 700; text-anchor: middle; }
.small { font-size: 10px; }
.tiny { font-size: 9px; }
.axis-time { font-size: 8px; text-anchor: middle; }
.caption { font-size: 11px; font-weight: 700; }
.center { text-anchor: middle; }
.event-text { dominant-baseline: central; }
.major-line, .axis-line { stroke: #111111; stroke-width: 1; }
.hairline, .tick { stroke: #111111; stroke-width: 0.8; }
.box.shaded { fill: #f8f8f8; stroke: #111111; stroke-width: 1; }
.callout { fill: #ffffff; stroke: #111111; stroke-width: 0.7; }
.diamond { fill: #ffffff; stroke: #111111; stroke-width: 0.9; }
</style>
<text x="44.0" y="36" class="title">FOUR-BOARD HEALTHY PATH: ROUTES FIRST</text>
<line x1="44.0" y1="60.0" x2="44.0" y2="650.0" class="major-line"/>
<line x1="44.0" y1="60.0" x2="2058.0" y2="60.0" class="major-line"/>
<text x="123.0" y="96.0" class="row-label">HOST / GUI</text>
<rect x="202.0" y="74.0" width="412.4" height="36.0" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
<text x="408.2" y="97.0" class="small center event-text" text-anchor="middle" font-weight="700"><tspan x="408.2" dy="0.0">Here-I-Am + exact 1/2/3-hop assignment</tspan></text>
<rect x="923.8" y="74.0" width="1134.2" height="36.0" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
<text x="1490.9" y="91.0" class="small center event-text" text-anchor="middle" font-weight="700"><tspan x="1490.9" dy="0.0">Survey: 20 s discovery start</tspan><tspan x="1490.9" dy="12.0">three 15 s pair barriers</tspan></text>
<line x1="44.0" y1="124.0" x2="2058.0" y2="124.0" class="major-line"/>
<text x="123.0" y="166.0" class="row-label">GATEWAY</text>
