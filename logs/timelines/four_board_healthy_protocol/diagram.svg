<rect x="923.8" y="154.0" width="412.4" height="36.0" fill="#ffffff" stroke="#111111" stroke-width="1"/>
<text x="1130.0" y="171.0" class="small center event-text" text-anchor="middle"><tspan x="1130.0" dy="0.0">Control waves at 2/4/6/8 s</tspan><tspan x="1130.0" dy="12.0">execute at +20 s</tspan></text>
<line x1="222.6" y1="150.0" x2="222.6" y2="154.0" class="hairline"/>
