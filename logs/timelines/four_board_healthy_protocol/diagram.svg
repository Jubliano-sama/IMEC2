<text x="123.0" y="236.0" class="row-label">DIRECT ANCHOR A</text>
<rect x="202.0" y="214.0" width="144.4" height="36.0" fill="#ffffff" stroke="#111111" stroke-width="1"/>
<text x="274.2" y="231.0" class="small center event-text" text-anchor="middle"><tspan x="274.2" dy="0.0">Direct gateway route + B</tspan><tspan x="274.2" dy="12.0">timing</tspan></text>
<rect x="614.4" y="214.0" width="309.3" height="36.0" fill="#f5f5f5" stroke="#111111" stroke-width="1"/>
<text x="769.1" y="231.0" class="small center event-text" text-anchor="middle"><tspan x="769.1" dy="0.0">Click pre-empts cadence</tspan><tspan x="769.1" dy="12.0">report resumes afterward</tspan></text>
<rect x="1336.2" y="214.0" width="721.8" height="36.0" fill="#ffffff" stroke="#111111" stroke-width="1"/>
<text x="1697.1" y="237.0" class="small center event-text" text-anchor="middle"><tspan x="1697.1" dy="0.0">Three pair actions share proven routes</tspan></text>
<line x1="44.0" y1="264.0" x2="2058.0" y2="264.0" class="major-line"/>
<text x="123.0" y="302.0" class="row-label">FORCED-1 RELAY B</text>
<rect x="202.0" y="274.0" width="144.4" height="48.0" fill="#ffffff" stroke="#111111" stroke-width="1"/>
<text x="274.2" y="303.0" class="small center event-text" text-anchor="middle"><tspan x="274.2" dy="0.0">Negotiate upstream with A</tspan></text>
<rect x="346.4" y="274.0" width="144.4" height="48.0" fill="#ffffff" stroke="#111111" stroke-width="1"/>
<text x="418.5" y="291.0" class="small center event-text" text-anchor="middle"><tspan x="418.5" dy="0.0">Then negotiate</tspan><tspan x="418.5" dy="12.0">downstream with C</tspan><tspan x="418.5" dy="12.0">320 ms counterphase</tspan></text>
<rect x="614.4" y="274.0" width="309.3" height="48.0" fill="#f5f5f5" stroke="#111111" stroke-width="1"/>
<text x="769.1" y="297.0" class="small center event-text" text-anchor="middle"><tspan x="769.1" dy="0.0">Retain relay custody</tspan><tspan x="769.1" dy="12.0">no route rediscovery</tspan></text>
<rect x="1336.2" y="274.0" width="721.8" height="48.0" fill="#ffffff" stroke="#111111" stroke-width="1"/>
<text x="1697.1" y="303.0" class="small center event-text" text-anchor="middle"><tspan x="1697.1" dy="0.0">Relay control/results on existing timings</tspan></text>
<line x1="44.0" y1="332.0" x2="2058.0" y2="332.0" class="major-line"/>
<text x="123.0" y="368.0" class="row-label">FORCED-2 ANCHOR C</text>
<rect x="346.4" y="346.0" width="144.4" height="36.0" fill="#ffffff" stroke="#111111" stroke-width="1"/>
<text x="418.5" y="363.0" class="small center event-text" text-anchor="middle"><tspan x="418.5" dy="0.0">Exact depth-2 parent</tspan><tspan x="418.5" dy="12.0">negotiation</tspan></text>
<rect x="614.4" y="346.0" width="309.3" height="36.0" fill="#f5f5f5" stroke="#111111" stroke-width="1"/>
<text x="769.1" y="363.0" class="small center event-text" text-anchor="middle"><tspan x="769.1" dy="0.0">Retain relay custody</tspan><tspan x="769.1" dy="12.0">no route rediscovery</tspan></text>
<rect x="1336.2" y="346.0" width="721.8" height="36.0" fill="#ffffff" stroke="#111111" stroke-width="1"/>
<text x="1697.1" y="369.0" class="small center event-text" text-anchor="middle"><tspan x="1697.1" dy="0.0">Pair action + reliable result</tspan></text>
<line x1="44.0" y1="396.0" x2="2058.0" y2="396.0" class="major-line"/>
<text x="123.0" y="432.0" class="row-label">CLICKER ACTION</text>
<rect x="614.4" y="410.0" width="309.3" height="36.0" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
<text x="769.1" y="427.0" class="small center event-text" text-anchor="middle" font-weight="700"><tspan x="769.1" dy="0.0">400 ms wake/range burst</tspan><tspan x="769.1" dy="12.0">then retained reports</tspan></text>
<line x1="44.0" y1="460.0" x2="2058.0" y2="460.0" class="major-line"/>
<text x="123.0" y="496.0" class="row-label">HEARTBEAT</text>
<rect x="202.0" y="474.0" width="1856.0" height="36.0" fill="#fafafa" stroke="#333333" stroke-width="1"/>
<text x="1130.0" y="491.0" class="small center event-text" text-anchor="middle"><tspan x="1130.0" dy="0.0">No protocol window reserved</tspan><tspan x="1130.0" dy="12.0">drop unless route and radio are ready</tspan></text>
<line x1="44.0" y1="524.0" x2="2058.0" y2="524.0" class="major-line"/>
<text x="123.0" y="561.0" class="row-label">KEY POINT</text>
<rect x="870.0" y="536.0" width="520.0" height="42.0" class="box shaded"/>
<text x="1130.0" y="556.0" class="small center" text-anchor="middle"><tspan x="1130.0" dy="0.0">The healthy path contains no route-repair allowance inside assignment, click, or survey. A</tspan><tspan x="1130.0" dy="12.0">missing route fails that operation visibly; background heartbeat never creates work.</tspan></text>
<line x1="44.0" y1="590.0" x2="2058.0" y2="590.0" class="major-line"/>
<line x1="44.0" y1="616.0" x2="44.0" y2="654.0" class="major-line"/>
