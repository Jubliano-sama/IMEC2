<text x="1180.0" y="390.0" class="small center" text-anchor="middle"><tspan x="1180.0" dy="0.0">The old constants spend 225 seconds waiting before useful RF across discovery and three</tspan><tspan x="1180.0" dy="12.0">serialized pairs. A 20-second discovery barrier plus three 15-second pair barriers leaves</tspan><tspan x="1180.0" dy="12.0">repeated control copies while moving the complete nominal survey inside about 90 seconds.</tspan></text>
