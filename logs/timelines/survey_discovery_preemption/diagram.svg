<svg xmlns="http://www.w3.org/2000/svg" width="4200" height="679" viewBox="0 0 4200 679" role="img">
<style>
svg { background: #ffffff; font-family: Arial, Helvetica, sans-serif; color: #111111; }
.title { font-size: 13px; font-weight: 700; }
.row-label { font-size: 13px; font-weight: 700; text-anchor: middle; }
.small { font-size: 10px; }
.tiny { font-size: 9px; }
.axis-time { font-size: 8px; text-anchor: middle; }
.caption { font-size: 11px; font-weight: 700; }
.center { text-anchor: middle; }
.event-text { dominant-baseline: central; }
.major-line, .axis-line { stroke: #111111; stroke-width: 1; }
.hairline, .tick { stroke: #111111; stroke-width: 0.8; }
.box.shaded { fill: #f8f8f8; stroke: #111111; stroke-width: 1; }
.callout { fill: #ffffff; stroke: #111111; stroke-width: 0.7; }
.diamond { fill: #ffffff; stroke: #111111; stroke-width: 0.9; }
</style>
<text x="44.0" y="36" class="title">SURVEY DISCOVERY PREEMPTION: EARLY BLACKOUT VS JUST-IN-TIME PREP</text>
<line x1="44.0" y1="60.0" x2="44.0" y2="542.0" class="major-line"/>
<line x1="44.0" y1="60.0" x2="4158.0" y2="60.0" class="major-line"/>
<text x="123.0" y="102.0" class="row-label">GATEWAY SURVEY CONTROL</text>
<rect x="374.1" y="90.0" width="40.6" height="36.0" fill="#ffffff" stroke="#111111" stroke-width="1"/>
<line x1="394.4" y1="95.0" x2="394.4" y2="90.0" class="hairline"/>
<rect x="306.2" y="62.0" width="176.4" height="25.0" class="callout"/>
<text x="310.2" y="73.5" class="tiny" text-anchor="start"><tspan x="310.2" dy="0.0">START accepted</tspan><tspan x="310.2" dy="11.0">future work queued</tspan></text>
<line x1="44.0" y1="136.0" x2="4158.0" y2="136.0" class="major-line"/>
<text x="123.0" y="172.0" class="row-label">ANCHOR B / OLD</text>
<rect x="374.1" y="150.0" width="3656.3" height="36.0" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
<text x="2202.2" y="167.0" class="small center event-text" text-anchor="middle" font-weight="700"><tspan x="2202.2" dy="0.0">Mesh reception stopped immediately</tspan><tspan x="2202.2" dy="12.0">85.955 s blackout</tspan></text>
<line x1="44.0" y1="200.0" x2="4158.0" y2="200.0" class="major-line"/>
<text x="123.0" y="242.0" class="row-label">ANCHOR B / CORRECTED</text>
<rect x="374.1" y="230.0" width="3609.4" height="36.0" fill="#ffffff" stroke="#111111" stroke-width="1"/>
<text x="2178.8" y="253.0" class="small center event-text" text-anchor="middle"><tspan x="2178.8" dy="0.0">Established-route traffic remains serviceable</tspan></text>
<rect x="3983.5" y="230.0" width="46.9" height="36.0" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
<line x1="4006.9" y1="235.0" x2="4006.9" y2="230.0" class="hairline"/>
<rect x="3911.9" y="202.0" width="190.0" height="25.0" class="callout"/>
<text x="3915.9" y="213.5" class="tiny" text-anchor="start"><tspan x="3915.9" dy="0.0">Existing worker quiesces mesh</tspan><tspan x="3915.9" dy="11.0">and prepares survey radio</tspan></text>
<line x1="44.0" y1="276.0" x2="4158.0" y2="276.0" class="major-line"/>
<text x="123.0" y="318.0" class="row-label">FORCED CHILD C</text>
<rect x="275.2" y="306.0" width="7.6" height="36.0" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
<rect x="438.6" y="306.0" width="7.6" height="36.0" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
<rect x="710.8" y="306.0" width="7.6" height="36.0" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
<rect x="1091.9" y="306.0" width="7.6" height="36.0" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
<line x1="279.0" y1="302.0" x2="279.0" y2="306.0" class="hairline"/>
<rect x="227.1" y="278.0" width="103.8" height="16.0" class="callout"/>
<text x="231.1" y="290.5" class="tiny" text-anchor="start"><tspan x="231.1" dy="0.0">command result TX 1</tspan></text>
<line x1="442.4" y1="302.0" x2="442.4" y2="306.0" class="hairline"/>
<rect x="415.4" y="278.0" width="54.0" height="16.0" class="callout"/>
<text x="419.4" y="290.5" class="tiny" text-anchor="start"><tspan x="419.4" dy="0.0">retry 2</tspan></text>
<line x1="714.6" y1="302.0" x2="714.6" y2="306.0" class="hairline"/>
<rect x="687.6" y="278.0" width="54.0" height="16.0" class="callout"/>
<text x="691.6" y="290.5" class="tiny" text-anchor="start"><tspan x="691.6" dy="0.0">retry 3</tspan></text>
<line x1="1095.7" y1="302.0" x2="1095.7" y2="306.0" class="hairline"/>
<rect x="1068.7" y="278.0" width="54.0" height="16.0" class="callout"/>
<text x="1072.7" y="290.5" class="tiny" text-anchor="start"><tspan x="1072.7" dy="0.0">retry 4</tspan></text>
<line x1="44.0" y1="352.0" x2="4158.0" y2="352.0" class="major-line"/>
<text x="123.0" y="388.0" class="row-label">PHYSICAL SURVEY</text>
<rect x="4030.4" y="366.0" width="127.6" height="36.0" fill="#ffffff" stroke="#111111" stroke-width="1"/>
<text x="4094.2" y="383.0" class="small center event-text" text-anchor="middle"><tspan x="4094.2" dy="0.0">Survey discovery</tspan><tspan x="4094.2" dy="12.0">begins</tspan></text>
<line x1="44.0" y1="416.0" x2="4158.0" y2="416.0" class="major-line"/>
<text x="123.0" y="453.0" class="row-label">KEY POINT</text>
<rect x="1920.0" y="428.0" width="520.0" height="42.0" class="box shaded"/>
<text x="2180.0" y="442.0" class="small center" text-anchor="middle"><tspan x="2180.0" dy="0.0">No new scheduler is needed. Admission records the future survey; the delayed worker performs</tspan><tspan x="2180.0" dy="12.0">the only transport preemption at -1.103 s, leaving the preceding 85 seconds available for</tspan><tspan x="2180.0" dy="12.0">established-route traffic.</tspan></text>
<line x1="44.0" y1="482.0" x2="4158.0" y2="482.0" class="major-line"/>
<line x1="44.0" y1="508.0" x2="44.0" y2="546.0" class="major-line"/>
<line x1="44.0" y1="508.0" x2="4158.0" y2="508.0" class="axis-line"/>
<line x1="374.1" y1="507.0" x2="374.1" y2="519.0" class="tick"/>
<line x1="1091.9" y1="507.0" x2="1091.9" y2="519.0" class="tick"/>
<line x1="3983.5" y1="507.0" x2="3983.5" y2="519.0" class="tick"/>
<line x1="4030.4" y1="507.0" x2="4030.4" y2="519.0" class="tick"/>
<text x="374.1" y="531.0" class="axis-time">-85.955 s</text>
<text x="1091.9" y="531.0" class="axis-time">-69.079 s</text>
<text x="3983.5" y="531.0" class="axis-time">-1.103 s</text>
<text x="4030.4" y="531.0" class="axis-time">t = 0</text>
<text x="374.1" y="560.5" class="tiny center" text-anchor="middle"><tspan x="374.1" dy="0.0">command admitted and queued</tspan></text>
<text x="1091.9" y="560.5" class="tiny center" text-anchor="middle"><tspan x="1091.9" dy="0.0">last observed child retry</tspan></text>
<text x="3983.5" y="560.5" class="tiny center" text-anchor="middle"><tspan x="3983.5" dy="0.0">just-in-time preparation begins</tspan></text>
<text x="4030.4" y="590.5" class="tiny center" text-anchor="middle"><tspan x="4030.4" dy="0.0">physical discovery starts</tspan></text>
<text x="2100.0" y="645.0" class="caption center" text-anchor="middle"><tspan x="2100.0" dy="0.0">Times are relative to the scheduled survey start. The observed anchor accepted the command about 86 seconds early. The old admission path immediately stopped ordinary mesh reception, so a child&#x27;s already-retained command result exhausted its retries during the blackout. The corrected path keeps mesh reception active until the existing 1,103 ms physical-preparation boundary.</tspan></text>
</svg>