<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="549" viewBox="0 0 1900 549" role="img">
<style>
svg { background: #ffffff; font-family: Arial, Helvetica, sans-serif; color: #111111; }
.title { font-size: 13px; font-weight: 700; }
.row-label { font-size: 13px; font-weight: 700; text-anchor: middle; }
.small { font-size: 10px; }
.tiny { font-size: 9px; }
.axis-time { font-size: 8px; text-anchor: middle; }
.caption { font-size: 11px; font-weight: 700; }
.center { text-anchor: middle; }
.event-text { dominant-baseline: central; }
.major-line, .axis-line { stroke: #111111; stroke-width: 1; }
.hairline, .tick { stroke: #111111; stroke-width: 0.8; }
.box.shaded { fill: #f8f8f8; stroke: #111111; stroke-width: 1; }
.callout { fill: #ffffff; stroke: #111111; stroke-width: 0.7; }
.diamond { fill: #ffffff; stroke: #111111; stroke-width: 0.9; }
</style>
<text x="44.0" y="36" class="title">CHANNEL-9 NEGOTIATION: ONE COMPOSED DEADLINE</text>
<line x1="44.0" y1="60.0" x2="44.0" y2="442.0" class="major-line"/>
<line x1="44.0" y1="60.0" x2="1858.0" y2="60.0" class="major-line"/>
<text x="123.0" y="96.0" class="row-label">CHILD / PROPOSER</text>
<rect x="202.0" y="74.0" width="1656.0" height="36.0" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
<text x="1030.0" y="91.0" class="small center event-text" text-anchor="middle" font-weight="700"><tspan x="1030.0" dy="0.0">One receive window</tspan><tspan x="1030.0" dy="12.0">covers queue + response retry</tspan></text>
<line x1="44.0" y1="124.0" x2="1858.0" y2="124.0" class="major-line"/>
<text x="123.0" y="160.0" class="row-label">PARENT RX WORKER</text>
<rect x="202.0" y="138.0" width="236.6" height="36.0" fill="#ffffff" stroke="#111111" stroke-width="1"/>
<text x="320.3" y="155.0" class="small center event-text" text-anchor="middle"><tspan x="320.3" dy="0.0">Bounded proposal queue</tspan><tspan x="320.3" dy="12.0">process or expire</tspan></text>
<rect x="438.6" y="138.0" width="1419.4" height="36.0" fill="#fafafa" stroke="#333333" stroke-width="1"/>
<text x="1148.3" y="161.0" class="small center event-text" text-anchor="middle"><tspan x="1148.3" dy="0.0">No stale proposal may start here</tspan></text>
<line x1="44.0" y1="188.0" x2="1858.0" y2="188.0" class="major-line"/>
<text x="123.0" y="224.0" class="row-label">PARENT ACCEPT OWNER</text>
<rect x="438.6" y="202.0" width="1419.4" height="36.0" fill="#f5f5f5" stroke="#111111" stroke-width="1"/>
<text x="1148.3" y="219.0" class="small center event-text" text-anchor="middle"><tspan x="1148.3" dy="0.0">Exact ACCEPT retained</tspan><tspan x="1148.3" dy="12.0">accepted-exchange authority remains valid</tspan></text>
<line x1="44.0" y1="252.0" x2="1858.0" y2="252.0" class="major-line"/>
<text x="123.0" y="288.0" class="row-label">PARENT RADIO OPPORTUNITIES</text>
<rect x="202.0" y="266.0" width="236.6" height="36.0" fill="#fafafa" stroke="#333333" stroke-width="1"/>
<text x="320.3" y="283.0" class="small center event-text" text-anchor="middle"><tspan x="320.3" dy="0.0">Existing Channel-9 work</tspan><tspan x="320.3" dy="12.0">may delay RX dispatch</tspan></text>
<rect x="438.6" y="266.0" width="1419.4" height="36.0" fill="#ffffff" stroke="#111111" stroke-width="1"/>
<text x="1148.3" y="283.0" class="small center event-text" text-anchor="middle"><tspan x="1148.3" dy="0.0">Six-second bounded retry</tspan><tspan x="1148.3" dy="12.0">uses the first legal Channel-5 gap</tspan></text>
<line x1="44.0" y1="316.0" x2="1858.0" y2="316.0" class="major-line"/>
<text x="123.0" y="353.0" class="row-label">KEY POINT</text>
<rect x="770.0" y="328.0" width="520.0" height="42.0" class="box shaded"/>
<text x="1030.0" y="342.0" class="small center" text-anchor="middle"><tspan x="1030.0" dy="0.0">One coherent rule replaces three unrelated clocks: listen = queued-proposal allowance + ACCEPT</tspan><tspan x="1030.0" dy="12.0">retry. The receiver drops older queued proposals, and a click may still pre-empt the entire</tspan><tspan x="1030.0" dy="12.0">negotiation.</tspan></text>
<line x1="44.0" y1="382.0" x2="1858.0" y2="382.0" class="major-line"/>
<line x1="44.0" y1="408.0" x2="44.0" y2="446.0" class="major-line"/>
<line x1="44.0" y1="408.0" x2="1858.0" y2="408.0" class="axis-line"/>
<line x1="202.0" y1="407.0" x2="202.0" y2="419.0" class="tick"/>
<line x1="438.6" y1="407.0" x2="438.6" y2="419.0" class="tick"/>
<line x1="1858.0" y1="407.0" x2="1858.0" y2="419.0" class="tick"/>
<text x="189.9" y="431.0" class="axis-time">t = 0</text>
<text x="426.5" y="431.0" class="axis-time">+1 s</text>
<text x="1845.9" y="431.0" class="axis-time">+7 s</text>
<text x="202.0" y="455.0" class="tiny center" text-anchor="middle"><tspan x="202.0" dy="0.0">PROPOSE sent and listener</tspan><tspan x="202.0" dy="11.0">opens</tspan></text>
<text x="438.6" y="455.0" class="tiny center" text-anchor="middle"><tspan x="438.6" dy="0.0">latest admitted proposal</tspan><tspan x="438.6" dy="11.0">processing</tspan></text>
<text x="1785.8" y="460.5" class="tiny center" text-anchor="middle"><tspan x="1785.8" dy="0.0">complete negotiation deadline</tspan></text>
<text x="950.0" y="515.0" class="caption center" text-anchor="middle"><tspan x="950.0" dy="0.0">A proposal may spend at most 1 s waiting for its receiver worker, then its retained ACCEPT has 6 s to find a legal Channel-5 gap. The proposer listens for the sum, and the accepted-exchange authority lasts for the complete ACCEPT retry interval.</tspan></text>
</svg>