<svg xmlns="http://www.w3.org/2000/svg" width="2600" height="603" viewBox="0 0 2600 603" role="img">
<style>
svg { background: #ffffff; font-family: Arial, Helvetica, sans-serif; color: #111111; }
.title { font-size: 13px; font-weight: 700; }
.row-label { font-size: 13px; font-weight: 700; text-anchor: middle; }
.small { font-size: 10px; }
.tiny { font-size: 9px; }
.axis-time { font-size: 8px; text-anchor: middle; }
.caption { font-size: 11px; font-weight: 700; }
.center { text-anchor: middle; }
.event-text { dominant-baseline: central; }
.major-line, .axis-line { stroke: #111111; stroke-width: 1; }
.hairline, .tick { stroke: #111111; stroke-width: 0.8; }
.box.shaded { fill: #f8f8f8; stroke: #111111; stroke-width: 1; }
.callout { fill: #ffffff; stroke: #111111; stroke-width: 0.7; }
.diamond { fill: #ffffff; stroke: #111111; stroke-width: 0.9; }
</style>
<text x="44.0" y="36" class="title">FORCED-2 CHANNEL-9 NEGOTIATION: RETRY PHASE SPLIT</text>
<line x1="44.0" y1="60.0" x2="44.0" y2="526.0" class="major-line"/>
<line x1="44.0" y1="60.0" x2="2558.0" y2="60.0" class="major-line"/>
<text x="123.0" y="114.0" class="row-label">C: FORCED-2 PROPOSER</text>
<rect x="202.0" y="90.0" width="94.2" height="60.0" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
<text x="249.1" y="107.0" class="small center event-text" text-anchor="middle" font-weight="700"><tspan x="249.1" dy="0.0">first PROPOSE</tspan><tspan x="249.1" dy="12.0">succeeds</tspan><tspan x="249.1" dy="12.0">phase must</tspan><tspan x="249.1" dy="12.0">freeze here</tspan></text>
<rect x="704.6" y="90.0" width="94.2" height="60.0" fill="#ffffff" stroke="#111111" stroke-width="1"/>
<text x="751.7" y="107.0" class="small center event-text" text-anchor="middle"><tspan x="751.7" dy="0.0">retry 1: same</tspan><tspan x="751.7" dy="12.0">bytes</tspan><tspan x="751.7" dy="12.0">but local phase</tspan><tspan x="751.7" dy="12.0">overwritten</tspan></text>
<rect x="1207.2" y="90.0" width="94.2" height="60.0" fill="#ffffff" stroke="#111111" stroke-width="1"/>
<rect x="1709.8" y="90.0" width="94.2" height="60.0" fill="#ffffff" stroke="#111111" stroke-width="1"/>
<line x1="1254.3" y1="95.0" x2="1254.3" y2="90.0" class="hairline"/>
<rect x="1159.3" y="62.0" width="190.0" height="25.0" class="callout"/>
<text x="1163.3" y="73.5" class="tiny" text-anchor="start"><tspan x="1163.3" dy="0.0">retry 2: same bytes</tspan><tspan x="1163.3" dy="11.0">local phase overwritten again</tspan></text>
<line x1="1757.0" y1="95.0" x2="1757.0" y2="90.0" class="hairline"/>
<rect x="1662.0" y="62.0" width="190.0" height="25.0" class="callout"/>
<text x="1666.0" y="73.5" class="tiny" text-anchor="start"><tspan x="1666.0" dy="0.0">retry 3: same bytes</tspan><tspan x="1666.0" dy="11.0">local phase overwritten again</tspan></text>
<line x1="44.0" y1="160.0" x2="2558.0" y2="160.0" class="major-line"/>
<text x="123.0" y="202.0" class="row-label">B: FORCED-1 RESPONDER</text>
<rect x="296.2" y="190.0" width="282.7" height="36.0" fill="#ffffff" stroke="#111111" stroke-width="1"/>
<text x="437.6" y="207.0" class="small center event-text" text-anchor="middle"><tspan x="437.6" dy="0.0">retain one exact ACCEPT</tspan><tspan x="437.6" dy="12.0">for this immutable proposal</tspan></text>
<rect x="1804.1" y="190.0" width="94.2" height="36.0" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
<line x1="1851.2" y1="195.0" x2="1851.2" y2="190.0" class="hairline"/>
<rect x="1756.2" y="162.0" width="190.0" height="25.0" class="callout"/>
<text x="1760.2" y="173.5" class="tiny" text-anchor="start"><tspan x="1760.2" dy="0.0">replayed ACCEPT succeeds</tspan><tspan x="1760.2" dy="11.0">original proposal authority</tspan></text>
<line x1="44.0" y1="236.0" x2="2558.0" y2="236.0" class="major-line"/>
<text x="123.0" y="290.0" class="row-label">NEGOTIATED CHANNEL-9 TURNS</text>
<rect x="1898.3" y="246.0" width="157.1" height="36.0" fill="#ffffff" stroke="#111111" stroke-width="1"/>
<text x="1976.9" y="263.0" class="small center event-text" text-anchor="middle"><tspan x="1976.9" dy="0.0">B RX turn named by retained</tspan><tspan x="1976.9" dy="12.0">counter</tspan></text>
<rect x="2055.4" y="290.0" width="157.1" height="36.0" fill="#ffffff" stroke="#111111" stroke-width="1"/>
<text x="2133.9" y="307.0" class="small center event-text" text-anchor="middle"><tspan x="2133.9" dy="0.0">C TX turn named three</tspan><tspan x="2133.9" dy="12.0">counters later</tspan></text>
<line x1="44.0" y1="336.0" x2="2558.0" y2="336.0" class="major-line"/>
<text x="123.0" y="372.0" class="row-label">OBSERVED RESULT</text>
<rect x="2212.5" y="350.0" width="345.5" height="36.0" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
<text x="2385.2" y="367.0" class="small center event-text" text-anchor="middle" font-weight="700"><tspan x="2385.2" dy="0.0">same cadence period, opposite parity:</tspan><tspan x="2385.2" dy="12.0">B listens one turn after C transmits</tspan></text>
<line x1="44.0" y1="400.0" x2="2558.0" y2="400.0" class="major-line"/>
<text x="123.0" y="437.0" class="row-label">KEY POINT</text>
<rect x="1120.0" y="412.0" width="520.0" height="42.0" class="box shaded"/>
<text x="1380.0" y="432.0" class="small center" text-anchor="middle"><tspan x="1380.0" dy="0.0">Freeze local proposal timing on the first successful RF send. Later byte-identical retries may</tspan><tspan x="1380.0" dy="12.0">recover the ACCEPT, but must not rewrite phase or counter state.</tspan></text>
<line x1="44.0" y1="466.0" x2="2558.0" y2="466.0" class="major-line"/>
<line x1="44.0" y1="492.0" x2="44.0" y2="530.0" class="major-line"/>
<line x1="44.0" y1="492.0" x2="2558.0" y2="492.0" class="axis-line"/>
<line x1="202.0" y1="491.0" x2="202.0" y2="503.0" class="tick"/>
<line x1="704.6" y1="491.0" x2="704.6" y2="503.0" class="tick"/>
<line x1="1207.2" y1="491.0" x2="1207.2" y2="503.0" class="tick"/>
<line x1="1709.8" y1="491.0" x2="1709.8" y2="503.0" class="tick"/>
<line x1="1898.3" y1="491.0" x2="1898.3" y2="503.0" class="tick"/>
<line x1="2212.5" y1="491.0" x2="2212.5" y2="503.0" class="tick"/>
<text x="202.0" y="515.0" class="axis-time">first proposal</text>
<text x="704.6" y="515.0" class="axis-time">retry 1</text>
<text x="1207.2" y="515.0" class="axis-time">retry 2</text>
<text x="1709.8" y="515.0" class="axis-time">retry 3</text>
<text x="1898.3" y="515.0" class="axis-time">ACCEPT</text>
<text x="2212.5" y="515.0" class="axis-time">miss</text>
<text x="1300.0" y="569.0" class="caption center" text-anchor="middle"><tspan x="1300.0" dy="0.0">PROPOSE bytes and identity stay unchanged across retries, so the parent correctly retains one ACCEPT. The child nevertheless overwrote its frozen local timing after every successful retry. Both endpoints then named the same physical cadence with counters three turns apart, making C transmit while B skipped to the opposite turn.</tspan></text>
</svg>