name: Mesh Deployment Policy

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Run repository source and policy gates
        run: python3 firmware/scripts/verify_changes.py --checks-only
