<text x="2216.0" y="758.5" class="small center" text-anchor="middle"><tspan x="2216.0" dy="0.0">The route and ACK identity are correct. The receiver is on the wrong channel at the only useful</tspan><tspan x="2216.0" dy="12.0">instant. The narrow guard now defers only a survey-control follow-up while that anchor owns a</tspan><tspan x="2216.0" dy="12.0">live channel-9 ACK wait; clicks and ordinary route discovery retain priority. The guard is built</tspan><tspan x="2216.0" dy="12.0">and flashed, but its live survey rerun is still pending.</tspan></text>
