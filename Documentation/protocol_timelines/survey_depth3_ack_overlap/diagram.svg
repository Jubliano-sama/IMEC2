<text x="2100.0" y="974.0" class="caption center" text-anchor="middle"><tspan x="2100.0" dy="0.0">Figure: Correlated four-board RTT trace, normalized around the forced-two-hop anchor&#x27;s reliable pair result. The result reaches the gateway through B and A. The exact gateway ACK returns to B, but C remains in an extended channel-5 survey-control listener across B&#x27;s known channel-9 ACK slot, then times out and retries.</tspan></text>
