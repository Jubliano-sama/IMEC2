<line x1="516.4" y1="752.0" x2="516.4" y2="764.0" class="tick"/>
<line x1="2136.7" y1="752.0" x2="2136.7" y2="764.0" class="tick"/>
<line x1="2150.9" y1="752.0" x2="2150.9" y2="764.0" class="tick"/>
<line x1="2271.7" y1="752.0" x2="2271.7" y2="764.0" class="tick"/>
<line x1="2563.1" y1="752.0" x2="2563.1" y2="764.0" class="tick"/>
<line x1="2669.7" y1="752.0" x2="2669.7" y2="764.0" class="tick"/>
<line x1="3415.9" y1="752.0" x2="3415.9" y2="764.0" class="tick"/>
<text x="516.4" y="776.0" class="axis-time">B receives C</text>
<text x="2136.7" y="776.0" class="axis-time">prepare boundary</text>
<text x="2207.7" y="776.0" class="axis-time">old RF send</text>
<text x="2271.7" y="776.0" class="axis-time">A RX armed</text>
<text x="2563.1" y="776.0" class="axis-time">parent event</text>
<text x="2669.7" y="776.0" class="axis-time">real send offset</text>
<text x="3415.9" y="776.0" class="axis-time">event end</text>
<text x="516.4" y="805.5" class="tiny center" text-anchor="middle"><tspan x="516.4" dy="0.0">child Channel-9 report is valid</tspan></text>
<text x="2136.7" y="805.5" class="tiny center" text-anchor="middle"><tspan x="2136.7" dy="0.0">B retry worker wakes</tspan></text>
<text x="2150.9" y="835.5" class="tiny center" text-anchor="middle"><tspan x="2150.9" dy="0.0">A is still configuring</tspan></text>
<text x="2271.7" y="805.5" class="tiny center" text-anchor="middle"><tspan x="2271.7" dy="0.0">old packet was 17 ms early</tspan></text>
<text x="2563.1" y="805.5" class="tiny center" text-anchor="middle"><tspan x="2563.1" dy="0.0">negotiated counter 112025208</tspan></text>
<text x="2669.7" y="835.5" class="tiny center" text-anchor="middle"><tspan x="2669.7" dy="0.0">fixed packet is inside RX</tspan></text>
<text x="3415.9" y="805.5" class="tiny center" text-anchor="middle"><tspan x="3415.9" dy="0.0">full receive reservation closes</tspan></text>
<text x="1800.0" y="890.0" class="caption center" text-anchor="middle"><tspan x="1800.0" dy="0.0">Figure: Exact ordering reconstructed from the four-probe RTT capture. Times are normalized to B&#x27;s negotiated upstream event start; the B-to-A clock offset is measured from matching event counter 112025208.</tspan></text>
