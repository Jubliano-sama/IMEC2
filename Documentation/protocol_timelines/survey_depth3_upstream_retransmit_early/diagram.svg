<text x="44.0" y="36" class="title">DEPTH-3 SURVEY UPLINK: PREPARATION IS NOT TRANSMISSION</text>
<line x1="44.0" y1="60.0" x2="44.0" y2="787.0" class="major-line"/>
<line x1="44.0" y1="60.0" x2="3558.0" y2="60.0" class="major-line"/>
<text x="166.5" y="96.0" class="row-label">FORCED2 C - REPORT</text>
<rect x="395.6" y="74.0" width="142.1" height="36.0" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
<text x="466.7" y="91.0" class="small center event-text" text-anchor="middle" font-weight="700"><tspan x="466.7" dy="0.0">C sends exact survey</tspan><tspan x="466.7" dy="12.0">discovery report</tspan></text>
<rect x="537.7" y="74.0" width="3020.3" height="36.0" fill="#ffffff" stroke="#111111" stroke-width="1"/>
