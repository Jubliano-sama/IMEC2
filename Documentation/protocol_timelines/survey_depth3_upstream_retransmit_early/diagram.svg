<line x1="44.0" y1="124.0" x2="3558.0" y2="124.0" class="major-line"/>
<text x="166.5" y="160.0" class="row-label">FORCED1 B - CHILD RX</text>
<rect x="431.1" y="138.0" width="177.7" height="36.0" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
<text x="520.0" y="155.0" class="small center event-text" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">Complete child-slot RX</tspan><tspan x="520.0" dy="12.0">MSG 0x41 from C</tspan></text>
<rect x="608.8" y="138.0" width="1527.9" height="36.0" fill="#ffffff" stroke="#111111" stroke-width="1"/>
<text x="1372.7" y="155.0" class="small center event-text" text-anchor="middle"><tspan x="1372.7" dy="0.0">Builds immutable forward</tspan><tspan x="1372.7" dy="12.0">waits for parent cadence</tspan></text>
<line x1="44.0" y1="188.0" x2="3558.0" y2="188.0" class="major-line"/>
<text x="166.5" y="224.0" class="row-label">FORCED1 B - RETAINED OWNER</text>
<rect x="516.4" y="202.0" width="1620.3" height="36.0" fill="#ffffff" stroke="#111111" stroke-width="1"/>
<text x="1326.6" y="219.0" class="small center event-text" text-anchor="middle"><tspan x="1326.6" dy="0.0">WAIT_RETRY_BACKOFF</tspan><tspan x="1326.6" dy="12.0">bytes + ingress C retained</tspan></text>
<rect x="2136.7" y="202.0" width="533.0" height="36.0" fill="#ffffff" stroke="#111111" stroke-width="1"/>
<text x="2403.2" y="219.0" class="small center event-text" text-anchor="middle"><tspan x="2403.2" dy="0.0">Same owner</tspan><tspan x="2403.2" dy="12.0">radio preparation</tspan></text>
<rect x="2669.7" y="202.0" width="888.3" height="36.0" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
<text x="3113.8" y="219.0" class="small center event-text" text-anchor="middle" font-weight="700"><tspan x="3113.8" dy="0.0">WAIT_GATEWAY_ACK</tspan><tspan x="3113.8" dy="12.0">after one real send</tspan></text>
<line x1="44.0" y1="252.0" x2="3558.0" y2="252.0" class="major-line"/>
<text x="166.5" y="314.0" class="row-label">OLD B RETRANSMIT</text>
<polygon points="2150.9,313.0 2155.9,318.0 2150.9,323.0 2145.9,318.0" class="diamond"/>
<rect x="2136.7" y="322.0" width="14.2" height="36.0" fill="#ffffff" stroke="#111111" stroke-width="1"/>
<rect x="2150.9" y="322.0" width="14.2" height="36.0" fill="#f5f5f5" stroke="#111111" stroke-width="1"/>
<rect x="2165.1" y="322.0" width="1392.9" height="36.0" fill="#f5f5f5" stroke="#111111" stroke-width="1"/>
<text x="2861.6" y="339.0" class="small center event-text" text-anchor="middle"><tspan x="2861.6" dy="0.0">No ACK</tspan><tspan x="2861.6" dy="12.0">retry continues</tspan></text>
<line x1="2143.8" y1="278.0" x2="2143.8" y2="322.0" class="hairline"/>
<rect x="2097.5" y="254.0" width="92.7" height="16.0" class="callout"/>
<text x="2101.5" y="266.5" class="tiny" text-anchor="start"><tspan x="2101.5" dy="0.0">Wake + configure</tspan></text>
<line x1="2150.9" y1="286.0" x2="2150.9" y2="318.0" class="hairline"/>
<text x="2129.2" y="285.0" class="tiny">too early</text>
<line x1="2158.0" y1="318.0" x2="2158.0" y2="322.0" class="hairline"/>
<rect x="2122.7" y="294.0" width="70.5" height="16.0" class="callout"/>
<text x="2126.7" y="306.5" class="tiny" text-anchor="start"><tspan x="2126.7" dy="0.0">BUG: RF send</tspan></text>
<line x1="44.0" y1="368.0" x2="3558.0" y2="368.0" class="major-line"/>
<text x="166.5" y="420.0" class="row-label">FIXED B RETRANSMIT</text>
<polygon points="2669.7,409.0 2674.7,414.0 2669.7,419.0 2664.7,414.0" class="diamond"/>
<rect x="2136.7" y="418.0" width="533.0" height="36.0" fill="#ffffff" stroke="#111111" stroke-width="1"/>
<text x="2403.2" y="435.0" class="small center event-text" text-anchor="middle"><tspan x="2403.2" dy="0.0">Wake + configure</tspan><tspan x="2403.2" dy="12.0">then hold exact bytes</tspan></text>
<rect x="2669.7" y="418.0" width="14.2" height="36.0" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
<rect x="2683.9" y="418.0" width="874.1" height="36.0" fill="#ffffff" stroke="#111111" stroke-width="1"/>
<text x="3120.9" y="441.0" class="small center event-text" text-anchor="middle"><tspan x="3120.9" dy="0.0">Await exact ACK</tspan></text>
<line x1="2669.7" y1="382.0" x2="2669.7" y2="414.0" class="hairline"/>
<text x="2648.7" y="381.0" class="tiny">correct</text>
<line x1="2676.8" y1="414.0" x2="2676.8" y2="418.0" class="hairline"/>
<rect x="2625.9" y="390.0" width="101.9" height="16.0" class="callout"/>
<text x="2629.9" y="402.5" class="tiny" text-anchor="start"><tspan x="2629.9" dy="0.0">RF send at slot +15</tspan></text>
<line x1="44.0" y1="464.0" x2="3558.0" y2="464.0" class="major-line"/>
<text x="166.5" y="528.0" class="row-label">DIRECT A - PARENT RX</text>
<rect x="2136.7" y="494.0" width="135.0" height="36.0" fill="#ffffff" stroke="#111111" stroke-width="1"/>
<text x="2204.2" y="517.0" class="small center event-text" text-anchor="middle"><tspan x="2204.2" dy="0.0">Configure Channel 9</tspan></text>
<rect x="2271.7" y="494.0" width="1144.2" height="36.0" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
<text x="2843.8" y="511.0" class="small center event-text" text-anchor="middle" font-weight="700"><tspan x="2843.8" dy="0.0">Receiver armed</tspan><tspan x="2843.8" dy="12.0">complete event window</tspan></text>
<rect x="2150.9" y="538.0" width="14.2" height="36.0" fill="#f5f5f5" stroke="#111111" stroke-width="1"/>
<rect x="2669.7" y="538.0" width="14.2" height="36.0" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
