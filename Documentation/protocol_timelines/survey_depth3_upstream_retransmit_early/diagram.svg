<rect x="2075.3" y="466.0" width="165.4" height="25.0" class="callout"/>
<text x="2079.3" y="477.5" class="tiny" text-anchor="start"><tspan x="2079.3" dy="0.0">Old packet arrives</tspan><tspan x="2079.3" dy="11.0">before RX arm</tspan></text>
<line x1="2676.8" y1="499.0" x2="2676.8" y2="538.0" class="hairline"/>
<rect x="2583.5" y="466.0" width="186.6" height="25.0" class="callout"/>
<text x="2587.5" y="477.5" class="tiny" text-anchor="start"><tspan x="2587.5" dy="0.0">Fixed packet decoded</tspan><tspan x="2587.5" dy="11.0">inside RX window</tspan></text>
<line x1="44.0" y1="584.0" x2="3558.0" y2="584.0" class="major-line"/>
<text x="166.5" y="620.0" class="row-label">OUTCOME</text>
<rect x="289.0" y="598.0" width="1847.7" height="36.0" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
<text x="1212.8" y="621.0" class="small center event-text" text-anchor="middle" font-weight="700"><tspan x="1212.8" dy="0.0">C to B path works</tspan></text>
<rect x="2136.7" y="598.0" width="426.4" height="36.0" fill="#f5f5f5" stroke="#111111" stroke-width="1"/>
<text x="2349.9" y="615.0" class="small center event-text" text-anchor="middle"><tspan x="2349.9" dy="0.0">OLD: preparation boundary</tspan><tspan x="2349.9" dy="12.0">was mistaken for send time</tspan></text>
<rect x="2563.1" y="598.0" width="994.9" height="36.0" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
<text x="3060.5" y="615.0" class="small center event-text" text-anchor="middle" font-weight="700"><tspan x="3060.5" dy="0.0">FIX: one shared slot-bound</tspan><tspan x="3060.5" dy="12.0">prepare helper</tspan></text>
<line x1="44.0" y1="648.0" x2="3558.0" y2="648.0" class="major-line"/>
<text x="166.5" y="691.5" class="row-label">KEY POINT</text>
<rect x="1663.5" y="660.0" width="520.0" height="55.0" class="box shaded"/>
<text x="1923.5" y="674.5" class="small center" text-anchor="middle"><tspan x="1923.5" dy="0.0">B receives C&#x27;s valid discovery report and retains it. The retry wakes at -60 ms so the radio can</tspan><tspan x="1923.5" dy="12.0">be configured, but the old path transmits at -58 ms while A is still configuring and 17 ms before</tspan><tspan x="1923.5" dy="12.0">A arms RX. The fixed path keeps the same custody and waits until the negotiated +15 ms send</tspan><tspan x="1923.5" dy="12.0">offset, inside A&#x27;s complete receive window.</tspan></text>
<line x1="44.0" y1="727.0" x2="3558.0" y2="727.0" class="major-line"/>
<line x1="44.0" y1="753.0" x2="44.0" y2="791.0" class="major-line"/>
