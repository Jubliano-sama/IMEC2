<text x="2286.0" y="878.5" class="small center" text-anchor="middle"><tspan x="2286.0" dy="0.0">The deepest legal four-hop copy can arrive by 80.000 s. Transport preemption plus PHY</tspan><tspan x="2286.0" dy="12.0">preparation consumes at most 1.103 s, so the fixed 90.000 s discovery start retains 8.897 s of</tspan><tspan x="2286.0" dy="12.0">true worst-case margin. The observed three-hop topology retains 18.897 s. This timing contract</tspan><tspan x="2286.0" dy="12.0">is feasible.</tspan></text>
