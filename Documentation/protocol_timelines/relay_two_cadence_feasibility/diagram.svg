<line x1="1934.1" y1="799.0" x2="1934.1" y2="811.0" class="tick"/>
<line x1="2301.0" y1="799.0" x2="2301.0" y2="811.0" class="tick"/>
<line x1="3401.8" y1="799.0" x2="3401.8" y2="811.0" class="tick"/>
<line x1="3524.1" y1="799.0" x2="3524.1" y2="811.0" class="tick"/>
<line x1="3768.8" y1="799.0" x2="3768.8" y2="811.0" class="tick"/>
<line x1="4258.0" y1="799.0" x2="4258.0" y2="811.0" class="tick"/>
<text x="327.4" y="823.0" class="axis-time">0 ms</text>
<text x="1795.2" y="823.0" class="axis-time">240 ms</text>
<text x="1917.5" y="823.0" class="axis-time">260 ms</text>
<text x="2284.4" y="823.0" class="axis-time">320 ms</text>
<text x="3385.3" y="823.0" class="axis-time">500 ms</text>
<text x="3507.6" y="823.0" class="axis-time">520 ms</text>
<text x="3752.2" y="823.0" class="axis-time">560 ms</text>
<text x="4241.4" y="823.0" class="axis-time">640 ms</text>
<text x="344.0" y="852.5" class="tiny center" text-anchor="middle"><tspan x="344.0" dy="0.0">cycle begins</tspan></text>
<text x="1811.8" y="852.5" class="tiny center" text-anchor="middle"><tspan x="1811.8" dy="0.0">first physical owner ends</tspan></text>
<text x="1934.1" y="882.5" class="tiny center" text-anchor="middle"><tspan x="1934.1" dy="0.0">current second owner starts too early</tspan></text>
<text x="2301.0" y="847.0" class="tiny center" text-anchor="middle"><tspan x="2301.0" dy="0.0">correct second owner starts after</tspan><tspan x="2301.0" dy="11.0">retune and receive</tspan></text>
<text x="3401.8" y="852.5" class="tiny center" text-anchor="middle"><tspan x="3401.8" dy="0.0">current second owner ends</tspan></text>
<text x="3524.1" y="877.0" class="tiny center" text-anchor="middle"><tspan x="3524.1" dy="0.0">current cycle repeats without a usable</tspan><tspan x="3524.1" dy="11.0">scan</tspan></text>
<text x="3768.8" y="852.5" class="tiny center" text-anchor="middle"><tspan x="3768.8" dy="0.0">correct second owner ends</tspan></text>
<text x="4202.1" y="852.5" class="tiny center" text-anchor="middle"><tspan x="4202.1" dy="0.0">correct cycle repeats</tspan></text>
<text x="2150.0" y="937.0" class="caption center" text-anchor="middle"><tspan x="2150.0" dy="0.0">Each Channel-9 turn owns 60 ms of early retune, 120 ms of event window, and 60 ms of trailing receive time. A usable Channel-5 opportunity needs another 60 ms transition reserve before its 20 ms receive slice.</tspan></text>
