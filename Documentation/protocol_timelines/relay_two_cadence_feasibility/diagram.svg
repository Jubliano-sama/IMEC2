<svg xmlns="http://www.w3.org/2000/svg" width="4300" height="971" viewBox="0 0 4300 971" role="img">
<style>
svg { background: #ffffff; font-family: Arial, Helvetica, sans-serif; color: #111111; }
.title { font-size: 13px; font-weight: 700; }
.row-label { font-size: 13px; font-weight: 700; text-anchor: middle; }
.small { font-size: 10px; }
.tiny { font-size: 9px; }
.axis-time { font-size: 8px; text-anchor: middle; }
.caption { font-size: 11px; font-weight: 700; }
.center { text-anchor: middle; }
.event-text { dominant-baseline: central; }
.major-line, .axis-line { stroke: #111111; stroke-width: 1; }
.hairline, .tick { stroke: #111111; stroke-width: 0.8; }
.box.shaded { fill: #f8f8f8; stroke: #111111; stroke-width: 1; }
.callout { fill: #ffffff; stroke: #111111; stroke-width: 0.7; }
.diamond { fill: #ffffff; stroke: #111111; stroke-width: 0.9; }
</style>
<text x="44.0" y="36" class="title">ONE RELAY, TWO CHANNEL-9 RHYTHMS: 520 MS LEAVES NO USABLE CHANNEL-5 GAP</text>
<line x1="44.0" y1="60.0" x2="44.0" y2="834.0" class="major-line"/>
<line x1="44.0" y1="60.0" x2="4258.0" y2="60.0" class="major-line"/>
<text x="194.0" y="96.0" class="row-label">CURRENT 520: FIRST CHANNEL-9 OWNER</text>
<rect x="344.0" y="74.0" width="1467.8" height="36.0" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
<text x="1077.9" y="97.0" class="small center event-text" text-anchor="middle" font-weight="700"><tspan x="1077.9" dy="0.0">60 guard + 120 event + 60 guard</tspan></text>
<line x1="44.0" y1="124.0" x2="4258.0" y2="124.0" class="major-line"/>
<text x="194.0" y="160.0" class="row-label">CURRENT 520: SECOND CHANNEL-9 OWNER</text>
