<text x="4241.4" y="623.0" class="axis-time">500 ms</text>
<text x="314.0" y="652.5" class="tiny center" text-anchor="middle"><tspan x="314.0" dy="0.0">range burst begins</tspan></text>
<text x="708.4" y="652.5" class="tiny center" text-anchor="middle"><tspan x="708.4" dy="0.0">next anchor exchange</tspan></text>
<text x="1102.8" y="652.5" class="tiny center" text-anchor="middle"><tspan x="1102.8" dy="0.0">third unique anchor reached</tspan></text>
