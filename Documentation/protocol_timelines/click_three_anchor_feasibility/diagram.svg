<text x="2680.4" y="652.5" class="tiny center" text-anchor="middle"><tspan x="2680.4" dy="0.0">all anchors have two opportunities</tspan></text>
<text x="3469.2" y="652.5" class="tiny center" text-anchor="middle"><tspan x="3469.2" dy="0.0">eighth exchange reservation ends</tspan></text>
<text x="4191.4" y="652.5" class="tiny center" text-anchor="middle"><tspan x="4191.4" dy="0.0">post-range delivery window</tspan></text>
<text x="2150.0" y="707.0" class="caption center" text-anchor="middle"><tspan x="2150.0" dy="0.0">Production schedule at the 50 ms minimum exchange stride. Eight sequential DS-TWR reservations fit exactly in the 400 ms burst; the round-robin order gives all three selected anchors at least two opportunities without overlapping the clicker&#x27;s single DWM3000.</tspan></text>
