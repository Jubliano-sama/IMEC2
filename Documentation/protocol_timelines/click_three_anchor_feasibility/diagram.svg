<text x="2286.0" y="622.0" class="small center" text-anchor="middle"><tspan x="2286.0" dy="0.0">Normal-click exchanges end after FINAL because each anchor owns the measurement and retained</tspan><tspan x="2286.0" dy="12.0">gateway report. The clicker uses one exchange at a time: A, B, C, D repeated three times, then</tspan><tspan x="2286.0" dy="12.0">releases the ranging owner with 4 ms left in the burst.</tspan></text>
