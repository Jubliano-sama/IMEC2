<text x="1891.6" y="353.0" class="small center event-text" text-anchor="middle"><tspan x="1891.6" dy="0.0">click priority: cadence work retained, no competing radio owner</tspan></text>
<rect x="3469.2" y="330.0" width="788.8" height="36.0" fill="#ffffff" stroke="#111111" stroke-width="1"/>
