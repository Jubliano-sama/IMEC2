<text x="179.0" y="416.0" class="row-label">REPORT DELIVERY</text>
<rect x="314.0" y="394.0" width="3155.2" height="36.0" fill="#fafafa" stroke="#333333" stroke-width="1"/>
<text x="1891.6" y="417.0" class="small center event-text" text-anchor="middle"><tspan x="1891.6" dy="0.0">no report is exposed before the range owner releases</tspan></text>
<rect x="3469.2" y="394.0" width="788.8" height="36.0" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
<text x="3863.6" y="417.0" class="small center event-text" text-anchor="middle" font-weight="700"><tspan x="3863.6" dy="0.0">three-anchor result enters reliable mesh custody</tspan></text>
<line x1="44.0" y1="444.0" x2="4258.0" y2="444.0" class="major-line"/>
<text x="179.0" y="480.0" class="row-label">PHYSICAL FEASIBILITY</text>
<rect x="314.0" y="458.0" width="3155.2" height="36.0" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
<text x="1891.6" y="481.0" class="small center event-text" text-anchor="middle" font-weight="700"><tspan x="1891.6" dy="0.0">8 x 50 ms = 400 ms exactly; no overlap</tspan></text>
<rect x="3469.2" y="458.0" width="788.8" height="36.0" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
<text x="3863.6" y="481.0" class="small center event-text" text-anchor="middle" font-weight="700"><tspan x="3863.6" dy="0.0">normal delivery resumes</tspan></text>
<line x1="44.0" y1="508.0" x2="4258.0" y2="508.0" class="major-line"/>
<text x="179.0" y="545.0" class="row-label">KEY POINT</text>
<rect x="2026.0" y="520.0" width="520.0" height="42.0" class="box shaded"/>
<text x="2286.0" y="534.0" class="small center" text-anchor="middle"><tspan x="2286.0" dy="0.0">This part is physically feasible. The clicker uses one exchange at a time: A, B, C, A, B, C, A, B.</tspan><tspan x="2286.0" dy="12.0">Existing Channel-9 custody is preempted and retained during the burst, then delivery resumes</tspan><tspan x="2286.0" dy="12.0">after the ranging owner releases.</tspan></text>
