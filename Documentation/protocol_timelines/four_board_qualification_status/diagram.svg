<rect x="2001.0" y="684.0" width="520.0" height="68.0" class="box shaded"/>
<text x="2261.0" y="699.0" class="small center" text-anchor="middle"><tspan x="2261.0" dy="0.0">Green: headless BLE, Here-I-Am, exact routes 1 / 2 / 3, durable assignment, TABLE ACKs, the full</tspan><tspan x="2261.0" dy="12.0">depth-3 survey downlink, and A/B discovery reports. Red: C stages and repeatedly transmits its</tspan><tspan x="2261.0" dy="12.0">report, but B retains an older upstream route-wait owner and launches route repair through the</tspan><tspan x="2261.0" dy="12.0">accepted child slot. That uplink arbitration fix and its regression are in progress; full survey</tspan><tspan x="2261.0" dy="12.0">and the click matrix remain pending.</tspan></text>
