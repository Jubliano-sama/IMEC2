<text x="844.6" y="289.0" class="small center event-text" text-anchor="middle"><tspan x="844.6" dy="0.0">Wait: parent gets upstream opportunity first</tspan></text>
<rect x="1295.2" y="266.0" width="225.3" height="36.0" fill="#ffffff" stroke="#111111" stroke-width="1"/>
<text x="1407.8" y="283.0" class="small center event-text" text-anchor="middle"><tspan x="1407.8" dy="0.0">CLAIM response</tspan><tspan x="1407.8" dy="12.0">one-parent contact</tspan></text>
<rect x="1520.5" y="266.0" width="901.2" height="36.0" fill="#ffffff" stroke="#111111" stroke-width="1" stroke-dasharray="3 3"/>
<text x="1971.1" y="289.0" class="small center event-text" text-anchor="middle"><tspan x="1971.1" dy="0.0">Custody or randomized recovery</tspan></text>
<rect x="2917.9" y="266.0" width="901.2" height="36.0" fill="#fafafa" stroke="#333333" stroke-width="1"/>
<text x="3368.5" y="289.0" class="small center event-text" text-anchor="middle"><tspan x="3368.5" dy="0.0">Wait for hop-1 stable-slot cell</tspan></text>
<rect x="3819.1" y="266.0" width="225.3" height="36.0" fill="#ffffff" stroke="#111111" stroke-width="1"/>
<text x="3931.8" y="289.0" class="small center event-text" text-anchor="middle"><tspan x="3931.8" dy="0.0">TABLE ACK then ACK_CONFIRM</tspan></text>
<rect x="4044.4" y="266.0" width="1113.6" height="36.0" fill="#fafafa" stroke="#333333" stroke-width="1"/>
<text x="4601.2" y="289.0" class="small center event-text" text-anchor="middle"><tspan x="4601.2" dy="0.0">Confirmed</tspan></text>
<line x1="44.0" y1="316.0" x2="5158.0" y2="316.0" class="major-line"/>
<text x="219.0" y="352.0" class="row-label">F2 - RF HOP 3 / TEMP SLOT 2</text>
