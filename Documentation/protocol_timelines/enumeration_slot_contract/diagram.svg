<text x="2669.8" y="91.0" class="small center event-text" text-anchor="middle"><tspan x="2669.8" dy="0.0">Immutable TABLE flood</tspan><tspan x="2669.8" dy="12.0">exact epoch + commitment</tspan></text>
<rect x="2917.9" y="74.0" width="2027.7" height="36.0" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
<text x="3931.8" y="91.0" class="small center event-text" text-anchor="middle" font-weight="700"><tspan x="3931.8" dy="0.0">TABLE response cells</tspan><tspan x="3931.8" dy="12.0">depth then stable slot</tspan></text>
<rect x="4945.6" y="74.0" width="212.4" height="36.0" fill="#ffffff" stroke="#111111" stroke-width="1" stroke-dasharray="3 3"/>
<text x="5051.8" y="91.0" class="small center event-text" text-anchor="middle"><tspan x="5051.8" dy="0.0">Settle or bounded recovery</tspan><tspan x="5051.8" dy="12.0">inside operation cap</tspan></text>
<line x1="44.0" y1="124.0" x2="5158.0" y2="124.0" class="major-line"/>
<text x="219.0" y="160.0" class="row-label">GATEWAY</text>
<rect x="394.0" y="138.0" width="2027.7" height="36.0" fill="#fafafa" stroke="#333333" stroke-width="1"/>
<text x="1407.8" y="155.0" class="small center event-text" text-anchor="middle"><tspan x="1407.8" dy="0.0">Collect current responders</tspan><tspan x="1407.8" dy="12.0">N is a quorum target, never a cap</tspan></text>
<rect x="2421.7" y="138.0" width="496.3" height="36.0" fill="#ffffff" stroke="#111111" stroke-width="1"/>
<text x="2669.8" y="161.0" class="small center event-text" text-anchor="middle"><tspan x="2669.8" dy="0.0">Durably retain exact TABLE before first publication RF</tspan></text>
<rect x="2917.9" y="138.0" width="2027.7" height="36.0" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
<text x="3931.8" y="155.0" class="small center event-text" text-anchor="middle" font-weight="700"><tspan x="3931.8" dy="0.0">ACK exact responses</tspan><tspan x="3931.8" dy="12.0">count ACK_CONFIRM 0/3 ... 3/3</tspan></text>
<rect x="4945.6" y="138.0" width="212.4" height="36.0" fill="#ffffff" stroke="#111111" stroke-width="1" stroke-dasharray="3 3"/>
<text x="5051.8" y="155.0" class="small center event-text" text-anchor="middle"><tspan x="5051.8" dy="0.0">Success only at 3/3</tspan><tspan x="5051.8" dy="12.0">timeout remains incomplete</tspan></text>
<line x1="44.0" y1="188.0" x2="5158.0" y2="188.0" class="major-line"/>
<text x="219.0" y="224.0" class="row-label">D - RF HOP 1 / TEMP SLOT 0</text>
<rect x="394.0" y="202.0" width="225.3" height="36.0" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
<text x="506.6" y="219.0" class="small center event-text" text-anchor="middle" font-weight="700"><tspan x="506.6" dy="0.0">CLAIM response</tspan><tspan x="506.6" dy="12.0">first possible cell</tspan></text>
<rect x="619.3" y="202.0" width="1802.4" height="36.0" fill="#fafafa" stroke="#333333" stroke-width="1"/>
<text x="1520.5" y="225.0" class="small center event-text" text-anchor="middle"><tspan x="1520.5" dy="0.0">Custody or idle; does not occupy later depth cells</tspan></text>
<rect x="2917.9" y="202.0" width="225.3" height="36.0" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
<text x="3030.6" y="219.0" class="small center event-text" text-anchor="middle" font-weight="700"><tspan x="3030.6" dy="0.0">TABLE ACK then ACK_CONFIRM</tspan><tspan x="3030.6" dy="12.0">commit on exact gateway ACK</tspan></text>
<rect x="3143.2" y="202.0" width="2014.8" height="36.0" fill="#fafafa" stroke="#333333" stroke-width="1"/>
<text x="4150.6" y="225.0" class="small center event-text" text-anchor="middle"><tspan x="4150.6" dy="0.0">Confirmed</tspan></text>
