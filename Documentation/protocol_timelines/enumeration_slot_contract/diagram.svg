<text x="1295.2" y="353.0" class="small center event-text" text-anchor="middle"><tspan x="1295.2" dy="0.0">Wait: D and F1 establish toward gateway</tspan></text>
<rect x="2196.4" y="330.0" width="225.3" height="36.0" fill="#ffffff" stroke="#111111" stroke-width="1"/>
<text x="2309.0" y="347.0" class="small center event-text" text-anchor="middle"><tspan x="2309.0" dy="0.0">CLAIM response</tspan><tspan x="2309.0" dy="12.0">two-relay contact</tspan></text>
<rect x="2421.7" y="330.0" width="496.3" height="36.0" fill="#fafafa" stroke="#333333" stroke-width="1"/>
<text x="2669.8" y="353.0" class="small center event-text" text-anchor="middle"><tspan x="2669.8" dy="0.0">TABLE flood received through established path</tspan></text>
<rect x="2917.9" y="330.0" width="1802.4" height="36.0" fill="#fafafa" stroke="#333333" stroke-width="1"/>
<text x="3819.1" y="353.0" class="small center event-text" text-anchor="middle"><tspan x="3819.1" dy="0.0">Wait for hop-2 stable-slot cell</tspan></text>
<rect x="4720.3" y="330.0" width="225.3" height="36.0" fill="#ffffff" stroke="#111111" stroke-width="1"/>
<text x="4833.0" y="353.0" class="small center event-text" text-anchor="middle"><tspan x="4833.0" dy="0.0">TABLE ACK then ACK_CONFIRM</tspan></text>
<rect x="4945.6" y="330.0" width="212.4" height="36.0" fill="#fafafa" stroke="#333333" stroke-width="1"/>
<text x="5051.8" y="353.0" class="small center event-text" text-anchor="middle"><tspan x="5051.8" dy="0.0">Confirmed</tspan></text>
