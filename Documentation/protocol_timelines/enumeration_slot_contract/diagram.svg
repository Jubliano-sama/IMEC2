<text x="1407.8" y="411.0" class="small center event-text" text-anchor="middle"><tspan x="1407.8" dy="0.0">F1 child contact; D keeps at most one</tspan><tspan x="1407.8" dy="12.0">downstream</tspan></text>
<rect x="2196.4" y="394.0" width="225.3" height="36.0" fill="#ffffff" stroke="#111111" stroke-width="1"/>
<text x="2309.0" y="411.0" class="small center event-text" text-anchor="middle"><tspan x="2309.0" dy="0.0">F2 child contact after F1 upstream</tspan><tspan x="2309.0" dy="12.0">opportunity</tspan></text>
<rect x="2917.9" y="394.0" width="225.3" height="36.0" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
<text x="3030.6" y="417.0" class="small center event-text" text-anchor="middle" font-weight="700"><tspan x="3030.6" dy="0.0">D confirmation</tspan></text>
<rect x="3819.1" y="394.0" width="225.3" height="36.0" fill="#ffffff" stroke="#111111" stroke-width="1"/>
<text x="3931.8" y="417.0" class="small center event-text" text-anchor="middle"><tspan x="3931.8" dy="0.0">F1 confirmation</tspan></text>
<rect x="4720.3" y="394.0" width="225.3" height="36.0" fill="#ffffff" stroke="#111111" stroke-width="1"/>
<text x="4833.0" y="417.0" class="small center event-text" text-anchor="middle"><tspan x="4833.0" dy="0.0">F2 confirmation</tspan></text>
<line x1="44.0" y1="444.0" x2="5158.0" y2="444.0" class="major-line"/>
<text x="219.0" y="480.0" class="row-label">STABLE TABLE AND CONFIRM QUORUM</text>
<rect x="394.0" y="458.0" width="2027.7" height="36.0" fill="#f5f5f5" stroke="#111111" stroke-width="1"/>
<text x="1407.8" y="481.0" class="small center event-text" text-anchor="middle"><tspan x="1407.8" dy="0.0">Responder set freezes after CLAIM collection; late new anchors wait for the next run</tspan></text>
<rect x="2421.7" y="458.0" width="496.3" height="36.0" fill="#ffffff" stroke="#111111" stroke-width="1"/>
<text x="2669.8" y="481.0" class="small center event-text" text-anchor="middle"><tspan x="2669.8" dy="0.0">Retained sparse slots stay fixed; new responders fill free slots in depth/identity order</tspan></text>
<rect x="2917.9" y="458.0" width="2027.7" height="36.0" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
<text x="3931.8" y="481.0" class="small center event-text" text-anchor="middle" font-weight="700"><tspan x="3931.8" dy="0.0">Every current responder proves this exact TABLE</tspan></text>
<rect x="4945.6" y="458.0" width="212.4" height="36.0" fill="#ffffff" stroke="#111111" stroke-width="1" stroke-dasharray="3 3"/>
<text x="5051.8" y="475.0" class="small center event-text" text-anchor="middle"><tspan x="5051.8" dy="0.0">Pending TABLE survives reset until</tspan><tspan x="5051.8" dy="12.0">confirmation debt is cleared</tspan></text>
<line x1="44.0" y1="508.0" x2="5158.0" y2="508.0" class="major-line"/>
<text x="219.0" y="544.0" class="row-label">GUI PHASE / COUNTDOWN</text>
<rect x="394.0" y="522.0" width="2027.7" height="36.0" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
<text x="1407.8" y="545.0" class="small center event-text" text-anchor="middle" font-weight="700"><tspan x="1407.8" dy="0.0">Collecting responses x/N</tspan></text>
<rect x="2421.7" y="522.0" width="496.3" height="36.0" fill="#ffffff" stroke="#111111" stroke-width="1"/>
<text x="2669.8" y="545.0" class="small center event-text" text-anchor="middle"><tspan x="2669.8" dy="0.0">Publishing exact slot table</tspan></text>
<rect x="2917.9" y="522.0" width="2027.7" height="36.0" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
<text x="3931.8" y="545.0" class="small center event-text" text-anchor="middle" font-weight="700"><tspan x="3931.8" dy="0.0">Confirmations x/R</tspan></text>
<rect x="4945.6" y="522.0" width="212.4" height="36.0" fill="#ffffff" stroke="#111111" stroke-width="1" stroke-dasharray="3 3"/>
<text x="5051.8" y="539.0" class="small center event-text" text-anchor="middle"><tspan x="5051.8" dy="0.0">Complete or Incomplete; countdown</tspan><tspan x="5051.8" dy="12.0">never fabricates success</tspan></text>
<line x1="44.0" y1="572.0" x2="5158.0" y2="572.0" class="major-line"/>
<text x="219.0" y="615.5" class="row-label">KEY POINT</text>
<rect x="2516.0" y="584.0" width="520.0" height="55.0" class="box shaded"/>
<text x="2776.0" y="598.5" class="small center" text-anchor="middle"><tspan x="2776.0" dy="0.0">Anchors initiate contact. Direct responses go first, then F1, then F2. A failed parent gets one</tspan><tspan x="2776.0" dy="12.0">randomized retry before a known alternate is tried. The gateway succeeds only after all three</tspan><tspan x="2776.0" dy="12.0">current CLAIM responders confirm the exact durable TABLE; retained anchors that did not</tspan><tspan x="2776.0" dy="12.0">answer this run are not in that quorum.</tspan></text>
