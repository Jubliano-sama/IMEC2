<text x="4044.4" y="700.0" class="axis-time">F1 confirmed</text>
<text x="4945.6" y="700.0" class="axis-time">F2 confirmed</text>
<text x="394.0" y="724.0" class="tiny center" text-anchor="middle"><tspan x="394.0" dy="0.0">CLAIM custody is complete; depth/slot</tspan><tspan x="394.0" dy="11.0">cells begin</tspan></text>
<text x="619.3" y="729.5" class="tiny center" text-anchor="middle"><tspan x="619.3" dy="0.0">next direct temporary slot would follow</tspan></text>
<text x="1295.2" y="729.5" class="tiny center" text-anchor="middle"><tspan x="1295.2" dy="0.0">all RF-hop-1 cells are earlier</tspan></text>
<text x="2196.4" y="724.0" class="tiny center" text-anchor="middle"><tspan x="2196.4" dy="0.0">all RF-hop-1 and RF-hop-2 cells are</tspan><tspan x="2196.4" dy="11.0">earlier</tspan></text>
<text x="2421.7" y="729.5" class="tiny center" text-anchor="middle"><tspan x="2421.7" dy="0.0">freeze current responders</tspan></text>
<text x="2917.9" y="729.5" class="tiny center" text-anchor="middle"><tspan x="2917.9" dy="0.0">same ordering, now with stable slots</tspan></text>
<text x="3143.2" y="729.5" class="tiny center" text-anchor="middle"><tspan x="3143.2" dy="0.0">exact TABLE gateway ACK observed</tspan></text>
<text x="4044.4" y="729.5" class="tiny center" text-anchor="middle"><tspan x="4044.4" dy="0.0">parent path remains available first</tspan></text>
<text x="4945.6" y="729.5" class="tiny center" text-anchor="middle"><tspan x="4945.6" dy="0.0">current responder quorum reaches 3/3</tspan></text>
<text x="2600.0" y="784.0" class="caption center" text-anchor="middle"><tspan x="2600.0" dy="0.0">Three-anchor D-F1-F2 example after the CLAIM flood. Each 2270 ms first-contact cell belongs to one estimated RF depth and temporary or stable slot. The TABLE flood is shown as a separate control interval; its real bounded custody window is topology-derived. Dashed recovery can continue inside the operation cap, but never pulls a deeper anchor into an earlier cell.</tspan></text>
