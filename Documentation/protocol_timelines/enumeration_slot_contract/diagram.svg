<text x="1407.8" y="91.0" class="small center event-text" text-anchor="middle" font-weight="700"><tspan x="1407.8" dy="0.0">CLAIM responses</tspan><tspan x="1407.8" dy="12.0">depth then temporary slot</tspan></text>
