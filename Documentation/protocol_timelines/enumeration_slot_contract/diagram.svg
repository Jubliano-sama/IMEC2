<text x="44.0" y="36" class="title">ENUMERATION: DEPTH-FIRST RESPONSES AND EXACT TABLE CONFIRMATION</text>
<line x1="44.0" y1="60.0" x2="44.0" y2="711.0" class="major-line"/>
<line x1="44.0" y1="60.0" x2="5158.0" y2="60.0" class="major-line"/>
