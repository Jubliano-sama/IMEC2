<text x="1322.5" y="753.5" class="tiny center" text-anchor="middle"><tspan x="1322.5" dy="0.0">A starts survey wake train</tspan></text>
<text x="1408.1" y="783.5" class="tiny center" text-anchor="middle"><tspan x="1408.1" dy="0.0">first B Channel-9 owner releases</tspan></text>
<text x="1489.7" y="753.5" class="tiny center" text-anchor="middle"><tspan x="1489.7" dy="0.0">second B Channel-9 owner begins</tspan></text>
<text x="2468.2" y="753.5" class="tiny center" text-anchor="middle"><tspan x="2468.2" dy="0.0">B radio is released</tspan></text>
<text x="2517.1" y="783.5" class="tiny center" text-anchor="middle"><tspan x="2517.1" dy="0.0">B&#x27;s deferred Channel-5 scan begins</tspan></text>
<text x="2529.3" y="813.5" class="tiny center" text-anchor="middle"><tspan x="2529.3" dy="0.0">old 3 ms scan already ended</tspan></text>
<text x="2598.6" y="843.5" class="tiny center" text-anchor="middle"><tspan x="2598.6" dy="0.0">new one-shot scan ends after capture</tspan></text>
<text x="2953.3" y="753.5" class="tiny center" text-anchor="middle"><tspan x="2953.3" dy="0.0">wake train ends</tspan></text>
<text x="3198.0" y="753.5" class="tiny center" text-anchor="middle"><tspan x="3198.0" dy="0.0">survey payload repeats begin</tspan></text>
<text x="3687.2" y="753.5" class="tiny center" text-anchor="middle"><tspan x="3687.2" dy="0.0">fourth survey payload completes</tspan></text>
<text x="4066.4" y="753.5" class="tiny center" text-anchor="middle"><tspan x="4066.4" dy="0.0">next ordinary scan is too late</tspan></text>
<text x="2150.0" y="898.0" class="caption center" text-anchor="middle"><tspan x="2150.0" dy="0.0">Normalized from the four-probe RTT trace. Direct anchor A transmits the survey wake train while forced relay B owns two adjacent Channel-9 receive reservations. A release-side latch survives both windows; B&#x27;s first real Channel-5 scan consumes it only after attempting the widened receive.</tspan></text>
