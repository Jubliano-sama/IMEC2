<text x="44.0" y="36" class="title">FOUR-BOARD SURVEY: A 3 MS SCAN CAN MISS A LIVE WAKE TRAIN</text>
<line x1="44.0" y1="60.0" x2="44.0" y2="735.0" class="major-line"/>
<line x1="44.0" y1="60.0" x2="4258.0" y2="60.0" class="major-line"/>
<text x="194.0" y="96.0" class="row-label">DIRECT A - CHANNEL 5</text>
<rect x="1322.5" y="74.0" width="1630.8" height="36.0" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
<text x="2137.9" y="91.0" class="small center event-text" text-anchor="middle" font-weight="700"><tspan x="2137.9" dy="0.0">400 ms wake train</tspan><tspan x="2137.9" dy="12.0">TX bursts alternate with 3 ms click-politeness listens</tspan></text>
<rect x="2953.3" y="74.0" width="244.6" height="36.0" fill="#ffffff" stroke="#111111" stroke-width="1"/>
<text x="3075.6" y="97.0" class="small center event-text" text-anchor="middle"><tspan x="3075.6" dy="0.0">60 ms control turnaround</tspan></text>
<rect x="3198.0" y="74.0" width="489.2" height="36.0" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
<text x="3442.6" y="91.0" class="small center event-text" text-anchor="middle" font-weight="700"><tspan x="3442.6" dy="0.0">Four survey-control frames</tspan><tspan x="3442.6" dy="12.0">40 ms repeat spacing</tspan></text>
<line x1="44.0" y1="124.0" x2="4258.0" y2="124.0" class="major-line"/>
<text x="194.0" y="160.0" class="row-label">FORCED1 B - CHILD CHANNEL 9</text>
<rect x="429.6" y="138.0" width="978.5" height="36.0" fill="#ffffff" stroke="#111111" stroke-width="1"/>
<text x="918.9" y="155.0" class="small center event-text" text-anchor="middle"><tspan x="918.9" dy="0.0">240 ms physical RX owner</tspan><tspan x="918.9" dy="12.0">child cadence</tspan></text>
<line x1="44.0" y1="188.0" x2="4258.0" y2="188.0" class="major-line"/>
<text x="194.0" y="224.0" class="row-label">FORCED1 B - PARENT CHANNEL 9</text>
<rect x="1489.7" y="202.0" width="978.5" height="36.0" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
<text x="1978.9" y="219.0" class="small center event-text" text-anchor="middle" font-weight="700"><tspan x="1978.9" dy="0.0">240 ms physical RX owner</tspan><tspan x="1978.9" dy="12.0">parent cadence</tspan></text>
<line x1="44.0" y1="252.0" x2="4258.0" y2="252.0" class="major-line"/>
<text x="194.0" y="304.0" class="row-label">FORCED1 B - OBSERVED CHANNEL 5</text>
<polygon points="2521.2,293.0 2526.2,298.0 2521.2,303.0 2516.2,298.0" class="diamond"/>
<rect x="2517.1" y="302.0" width="12.2" height="36.0" fill="#f5f5f5" stroke="#111111" stroke-width="1"/>
<rect x="2529.3" y="302.0" width="1537.1" height="36.0" fill="#fafafa" stroke="#333333" stroke-width="1"/>
<text x="3297.8" y="325.0" class="small center event-text" text-anchor="middle"><tspan x="3297.8" dy="0.0">ordinary 380 ms reschedule</tspan></text>
<rect x="4066.4" y="302.0" width="12.2" height="36.0" fill="#f5f5f5" stroke="#111111" stroke-width="1"/>
<line x1="2521.2" y1="266.0" x2="2521.2" y2="298.0" class="hairline"/>
<text x="2500.2" y="265.0" class="tiny">empty</text>
<line x1="2523.2" y1="307.0" x2="2523.2" y2="302.0" class="hairline"/>
<rect x="2479.4" y="274.0" width="87.6" height="25.0" class="callout"/>
<text x="2483.4" y="285.5" class="tiny" text-anchor="start"><tspan x="2483.4" dy="0.0">3 ms scan</tspan><tspan x="2483.4" dy="11.0">empty</tspan></text>
<line x1="4072.5" y1="287.0" x2="4072.5" y2="302.0" class="hairline"/>
<rect x="3998.9" y="254.0" width="147.2" height="25.0" class="callout"/>
<text x="4002.9" y="265.5" class="tiny" text-anchor="start"><tspan x="4002.9" dy="0.0">next 3 ms scan</tspan><tspan x="4002.9" dy="11.0">after payload</tspan></text>
<line x1="44.0" y1="348.0" x2="4258.0" y2="348.0" class="major-line"/>
<text x="194.0" y="412.0" class="row-label">FORCED1 B - RECOVERY SCAN</text>
<polygon points="2557.9,389.0 2562.9,394.0 2557.9,399.0 2552.9,394.0" class="diamond"/>
<rect x="2468.2" y="398.0" width="48.9" height="60.0" fill="#ffffff" stroke="#111111" stroke-width="1"/>
<text x="2492.6" y="415.0" class="small center event-text" text-anchor="middle"><tspan x="2492.6" dy="0.0">releas</tspan><tspan x="2492.6" dy="12.0">e latch</tspan><tspan x="2492.6" dy="12.0">retain</tspan><tspan x="2492.6" dy="12.0">ed</tspan></text>
<rect x="2517.1" y="398.0" width="81.5" height="60.0" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
<rect x="2598.6" y="398.0" width="1088.6" height="60.0" fill="#ffffff" stroke="#111111" stroke-width="1"/>
<text x="3142.9" y="427.0" class="small center event-text" text-anchor="middle"><tspan x="3142.9" dy="0.0">existing control handoff</tspan><tspan x="3142.9" dy="12.0">continuous extended listener</tspan></text>
<line x1="2557.9" y1="362.0" x2="2557.9" y2="394.0" class="hairline"/>
<text x="2536.9" y="361.0" class="tiny">capture</text>
<line x1="2557.9" y1="403.0" x2="2557.9" y2="398.0" class="hairline"/>
<rect x="2462.9" y="370.0" width="190.0" height="25.0" class="callout"/>
<text x="2466.9" y="381.5" class="tiny" text-anchor="start"><tspan x="2466.9" dy="0.0">one 20 ms post-CH9 recovery scan</tspan><tspan x="2466.9" dy="11.0">captures remaining wake claims</tspan></text>
<line x1="44.0" y1="468.0" x2="4258.0" y2="468.0" class="major-line"/>
<text x="194.0" y="504.0" class="row-label">FORCED2 C - CHANNEL 5</text>
<rect x="1322.5" y="482.0" width="2364.7" height="36.0" fill="#ffffff" stroke="#111111" stroke-width="1"/>
<text x="2504.9" y="499.0" class="small center event-text" text-anchor="middle"><tspan x="2504.9" dy="0.0">Hears A directly</tspan><tspan x="2504.9" dy="12.0">rejects hop 1 as required for forced depth 2</tspan></text>
<line x1="44.0" y1="532.0" x2="4258.0" y2="532.0" class="major-line"/>
<text x="194.0" y="568.0" class="row-label">SURVEY DOWNLINK</text>
<rect x="1322.5" y="546.0" width="1206.8" height="36.0" fill="#f5f5f5" stroke="#111111" stroke-width="1"/>
<text x="1925.9" y="569.0" class="small center event-text" text-anchor="middle"><tspan x="1925.9" dy="0.0">OBSERVED: required relay B never wakes</tspan></text>
<rect x="2529.3" y="546.0" width="1157.9" height="36.0" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
<text x="3108.3" y="569.0" class="small center event-text" text-anchor="middle" font-weight="700"><tspan x="3108.3" dy="0.0">FIXED MODEL: B wakes, accepts hop 1, and can reflood hop 2</tspan></text>
<rect x="3687.2" y="546.0" width="570.8" height="36.0" fill="#ffffff" stroke="#111111" stroke-width="1"/>
<text x="3972.6" y="569.0" class="small center event-text" text-anchor="middle"><tspan x="3972.6" dy="0.0">No new owner, packet format, or retry lane</tspan></text>
<line x1="44.0" y1="596.0" x2="4258.0" y2="596.0" class="major-line"/>
<text x="194.0" y="639.5" class="row-label">KEY POINT</text>
<rect x="2041.0" y="608.0" width="520.0" height="55.0" class="box shaded"/>
<text x="2301.0" y="622.5" class="small center" text-anchor="middle"><tspan x="2301.0" dy="0.0">Each successfully released Channel-9 window idempotently arms one atomic recovery latch. The</tspan><tspan x="2301.0" dy="12.0">first real scan widens from 3 ms to the existing 20 ms control-followup slice, spans the sender&#x27;s</tspan><tspan x="2301.0" dy="12.0">politeness-listen gap, captures the still-live wake train, and then reuses the existing control</tspan><tspan x="2301.0" dy="12.0">handoff.</tspan></text>
