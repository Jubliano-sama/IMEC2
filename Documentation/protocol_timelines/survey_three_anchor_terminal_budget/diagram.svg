<text x="1236.7" y="157.5" class="tiny" text-anchor="start"><tspan x="1236.7" dy="0.0">4 rounds x 6 slots x 40 ms</tspan><tspan x="1236.7" dy="11.0">all anchors run in parallel</tspan></text>
<line x1="44.0" y1="232.0" x2="4258.0" y2="232.0" class="major-line"/>
