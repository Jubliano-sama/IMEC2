<text x="1225.5" y="138.5" class="tiny" text-anchor="start"><tspan x="1225.5" dy="0.0">Transport preemption + PHY preparation</tspan></text>
<line x1="1327.7" y1="179.0" x2="1327.7" y2="174.0" class="hairline"/>
