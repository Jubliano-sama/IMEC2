<text x="996.3" y="97.0" class="small center event-text" text-anchor="middle"><tspan x="996.3" dy="0.0">Latest legal depth-4 propagation envelope</tspan></text>
<line x1="44.0" y1="124.0" x2="4258.0" y2="124.0" class="major-line"/>
