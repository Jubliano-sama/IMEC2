<text x="1407.0" y="269.0" class="small center event-text" text-anchor="middle"><tspan x="1407.0" dy="0.0">Six retained emission slots</tspan></text>
<rect x="1481.0" y="246.0" width="456.6" height="36.0" fill="#ffffff" stroke="#111111" stroke-width="1"/>
<text x="1709.3" y="269.0" class="small center event-text" text-anchor="middle"><tspan x="1709.3" dy="0.0">Maximum hop-aware custody</tspan></text>
<rect x="1937.7" y="246.0" width="689.4" height="36.0" fill="#ffffff" stroke="#111111" stroke-width="1"/>
<text x="2282.4" y="269.0" class="small center event-text" text-anchor="middle"><tspan x="2282.4" dy="0.0">Direct/mesh ACK-repair tail + guards</tspan></text>
<line x1="44.0" y1="296.0" x2="4258.0" y2="296.0" class="major-line"/>
<text x="194.0" y="338.0" class="row-label">DISCOVERY COLLECTION CONTRACT</text>
<polygon points="2953.3,317.0 2958.3,322.0 2953.3,327.0 2948.3,322.0" class="diamond"/>
<rect x="344.0" y="326.0" width="2283.1" height="36.0" fill="#ffffff" stroke="#111111" stroke-width="1"/>
<text x="1485.5" y="349.0" class="small center event-text" text-anchor="middle"><tspan x="1485.5" dy="0.0">Existing worst-case discovery/report accounting</tspan></text>
<rect x="2627.1" y="326.0" width="326.2" height="36.0" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
<text x="2790.2" y="349.0" class="small center event-text" text-anchor="middle" font-weight="700"><tspan x="2790.2" dy="0.0">30.007 s policy margin</tspan></text>
<line x1="2953.3" y1="310.0" x2="2953.3" y2="322.0" class="hairline"/>
<text x="2913.9" y="309.0" class="tiny">collection ceiling</text>
<line x1="44.0" y1="372.0" x2="4258.0" y2="372.0" class="major-line"/>
<text x="194.0" y="408.0" class="row-label">THREE PAIR EDGES + RERUNS</text>
<rect x="2953.3" y="386.0" width="1174.2" height="36.0" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
<text x="3540.4" y="403.0" class="small center event-text" text-anchor="middle" font-weight="700"><tspan x="3540.4" dy="0.0">Up to 9 x 12 s pair-control floors</tspan><tspan x="3540.4" dy="12.0">3 edges x initial + 2 reruns</tspan></text>
<rect x="4127.5" y="386.0" width="130.5" height="36.0" fill="#ffffff" stroke="#111111" stroke-width="1"/>
<text x="4192.8" y="403.0" class="small center event-text" text-anchor="middle"><tspan x="4192.8" dy="0.0">Terminal/host</tspan><tspan x="4192.8" dy="12.0">settlement margin</tspan></text>
