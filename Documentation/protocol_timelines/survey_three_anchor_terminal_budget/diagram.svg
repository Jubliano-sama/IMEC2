<text x="1322.5" y="763.5" class="tiny center" text-anchor="middle"><tspan x="1322.5" dy="0.0">all anchors share the scheduled instant</tspan></text>
<text x="1332.9" y="793.5" class="tiny center" text-anchor="middle"><tspan x="1332.9" dy="0.0">24 physical slots complete</tspan></text>
<text x="2627.1" y="733.5" class="tiny center" text-anchor="middle"><tspan x="2627.1" dy="0.0">all existing report terms end</tspan></text>
<text x="2953.3" y="733.5" class="tiny center" text-anchor="middle"><tspan x="2953.3" dy="0.0">missing-report collection closes</tspan></text>
<text x="4127.5" y="733.5" class="tiny center" text-anchor="middle"><tspan x="4127.5" dy="0.0">three K3 edges with two reruns</tspan></text>
<text x="4205.6" y="763.5" class="tiny center" text-anchor="middle"><tspan x="4205.6" dy="0.0">hard survey terminal</tspan></text>
<text x="2150.0" y="848.0" class="caption center" text-anchor="middle"><tspan x="2150.0" dy="0.0">Parallel contract view in real milliseconds. Discovery waves and per-anchor work overlap. The collection ceiling terminates a missing-report case; the operation ceiling terminates any later pair-control stall.</tspan></text>
