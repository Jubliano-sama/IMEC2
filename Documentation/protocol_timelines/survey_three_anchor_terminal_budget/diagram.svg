<rect x="344.0" y="74.0" width="434.9" height="36.0" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
<text x="561.4" y="97.0" class="small center event-text" text-anchor="middle" font-weight="700"><tspan x="561.4" dy="0.0">Initial survey flood + four 10 s redrives</tspan></text>
