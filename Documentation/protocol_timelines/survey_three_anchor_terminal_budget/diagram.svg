<rect x="344.0" y="486.0" width="2609.3" height="36.0" fill="#f5f5f5" stroke="#111111" stroke-width="1"/>
<text x="1648.7" y="509.0" class="small center event-text" text-anchor="middle"><tspan x="1648.7" dy="0.0">Missing report ends here</tspan></text>
<rect x="2953.3" y="486.0" width="1304.7" height="36.0" fill="#ffffff" stroke="#111111" stroke-width="1"/>
<text x="3605.7" y="509.0" class="small center event-text" text-anchor="middle"><tspan x="3605.7" dy="0.0">Pair work may continue only inside this bound</tspan></text>
<rect x="4247.1" y="530.0" width="10.9" height="36.0" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
<line x1="4252.6" y1="462.0" x2="4252.6" y2="530.0" class="hairline"/>
<rect x="4069.2" y="438.0" width="188.8" height="16.0" class="callout"/>
<text x="4073.2" y="450.5" class="tiny" text-anchor="start"><tspan x="4073.2" dy="0.0">Complete or fail; never wait 15 minutes</tspan></text>
<line x1="4258.0" y1="470.0" x2="4258.0" y2="482.0" class="hairline"/>
<text x="4176.2" y="469.0" class="tiny">operation ceiling</text>
<line x1="44.0" y1="576.0" x2="4258.0" y2="576.0" class="major-line"/>
<text x="194.0" y="619.5" class="row-label">KEY POINT</text>
<rect x="2041.0" y="588.0" width="520.0" height="55.0" class="box shaded"/>
<text x="2301.0" y="602.5" class="small center" text-anchor="middle"><tspan x="2301.0" dy="0.0">The 15-minute collection window was unnecessary. The existing physical and custody bounds fit</tspan><tspan x="2301.0" dy="12.0">by about 210 s, so 240 s leaves 30 s margin. Three anchors create three pair edges; with two</tspan><tspan x="2301.0" dy="12.0">reruns, nine 12 s control floors fit in the remaining 120 s, with 12 s left for terminal</tspan><tspan x="2301.0" dy="12.0">settlement. Healthy expected-count runs leave collection early.</tspan></text>
