<text x="2266.0" y="586.5" class="small center" text-anchor="middle"><tspan x="2266.0" dy="0.0">Live four-probe RTT now proves the fix: forced-two-hop C rejects the direct and one-hop</tspan><tspan x="2266.0" dy="12.0">copies, captures B&#x27;s later standard wake inside the 2-second listener, accepts the exact</tspan><tspan x="2266.0" dy="12.0">two-hop payload, runs discovery, and stages its report. The remaining failure is a separate</tspan><tspan x="2266.0" dy="12.0">reliable-uplink arbitration defect shown in survey_depth3_uplink_route_wait_collision.</tspan></text>
