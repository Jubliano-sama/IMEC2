<text x="2296.0" y="687.0" class="small center" text-anchor="middle"><tspan x="2296.0" dy="0.0">The old schedule asked one radio to serve four Channel-9 turns during one 2,000 ms Channel-5</tspan><tspan x="2296.0" dy="12.0">contact. The feasible schedule uses short released scans only until the relayed wake is found,</tspan><tspan x="2296.0" dy="12.0">then cancels that search and gives the accepted gateway-control contact exclusive ownership.</tspan><tspan x="2296.0" dy="12.0">Channel-9 custody is retained across four missed turns, below the production limit of eight, and</tspan><tspan x="2296.0" dy="12.0">is rearmed after release.</tspan></text>
