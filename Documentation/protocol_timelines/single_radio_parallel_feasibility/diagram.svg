<text x="2150.0" y="945.0" class="caption center" text-anchor="middle"><tspan x="2150.0" dy="0.0">Real millisecond scale at one forced-hop anchor. A Channel-9 physical turn includes the 50 ms prepare guard, 120 ms event window, and 60 ms late guard. Gateway Channel-5 control has the documented higher priority.</tspan></text>
