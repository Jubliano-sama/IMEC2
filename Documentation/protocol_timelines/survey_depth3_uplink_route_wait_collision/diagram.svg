<line x1="284.0" y1="725.0" x2="284.0" y2="737.0" class="tick"/>
<line x1="999.3" y1="725.0" x2="999.3" y2="737.0" class="tick"/>
<line x1="1237.8" y1="725.0" x2="1237.8" y2="737.0" class="tick"/>
<line x1="1953.1" y1="725.0" x2="1953.1" y2="737.0" class="tick"/>
<line x1="2747.9" y1="725.0" x2="2747.9" y2="737.0" class="tick"/>
<line x1="3065.8" y1="725.0" x2="3065.8" y2="737.0" class="tick"/>
<line x1="3304.2" y1="725.0" x2="3304.2" y2="737.0" class="tick"/>
<line x1="3622.2" y1="725.0" x2="3622.2" y2="737.0" class="tick"/>
<line x1="4258.0" y1="725.0" x2="4258.0" y2="737.0" class="tick"/>
<text x="265.2" y="749.0" class="axis-time">survey command</text>
<text x="980.5" y="749.0" class="axis-time">B waiter stored</text>
<text x="1219.0" y="749.0" class="axis-time">C admitted</text>
<text x="1934.3" y="749.0" class="axis-time">C report staged</text>
<text x="2729.1" y="749.0" class="axis-time">EVENT_ACCEPT</text>
<text x="3047.0" y="749.0" class="axis-time">route probe</text>
<text x="3285.4" y="749.0" class="axis-time">first C TX</text>
<text x="3603.4" y="749.0" class="axis-time">retries</text>
<text x="4239.2" y="749.0" class="axis-time">timeout</text>
<text x="284.0" y="778.5" class="tiny center" text-anchor="middle"><tspan x="284.0" dy="0.0">gateway begins bounded discovery</tspan></text>
<text x="999.3" y="778.5" class="tiny center" text-anchor="middle"><tspan x="999.3" dy="0.0">upstream timing is absent</tspan></text>
<text x="1237.8" y="778.5" class="tiny center" text-anchor="middle"><tspan x="1237.8" dy="0.0">exact hop-2 control accepted</tspan></text>
<text x="1953.1" y="778.5" class="tiny center" text-anchor="middle"><tspan x="1953.1" dy="0.0">local custody is valid</tspan></text>
<text x="2747.9" y="778.5" class="tiny center" text-anchor="middle"><tspan x="2747.9" dy="0.0">B admits downstream cadence</tspan></text>
<text x="3065.8" y="778.5" class="tiny center" text-anchor="middle"><tspan x="3065.8" dy="0.0">B&#x27;s older upstream owner takes radio</tspan></text>
<text x="3304.2" y="778.5" class="tiny center" text-anchor="middle"><tspan x="3304.2" dy="0.0">no corresponding B receive</tspan></text>
<text x="3622.2" y="773.0" class="tiny center" text-anchor="middle"><tspan x="3622.2" dy="0.0">C retains and retransmits the same</tspan><tspan x="3622.2" dy="11.0">report</tspan></text>
<text x="4186.3" y="778.5" class="tiny center" text-anchor="middle"><tspan x="4186.3" dy="0.0">gateway still has only A and B</tspan></text>
<text x="2150.0" y="833.0" class="caption center" text-anchor="middle"><tspan x="2150.0" dy="0.0">Figure: Protocol-order reconstruction from the correlated four-probe RTT trace. Horizontal position is normalized ordering across device clocks, not a shared millisecond clock.</tspan></text>
