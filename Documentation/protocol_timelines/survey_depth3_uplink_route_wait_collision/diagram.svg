<svg xmlns="http://www.w3.org/2000/svg" width="4300" height="867" viewBox="0 0 4300 867" role="img">
<style>
svg { background: #ffffff; font-family: Arial, Helvetica, sans-serif; color: #111111; }
.title { font-size: 13px; font-weight: 700; }
.row-label { font-size: 13px; font-weight: 700; text-anchor: middle; }
.small { font-size: 10px; }
.tiny { font-size: 9px; }
.axis-time { font-size: 8px; text-anchor: middle; }
.caption { font-size: 11px; font-weight: 700; }
.center { text-anchor: middle; }
.event-text { dominant-baseline: central; }
.major-line, .axis-line { stroke: #111111; stroke-width: 1; }
.hairline, .tick { stroke: #111111; stroke-width: 0.8; }
.box.shaded { fill: #f8f8f8; stroke: #111111; stroke-width: 1; }
.callout { fill: #ffffff; stroke: #111111; stroke-width: 0.7; }
.diamond { fill: #ffffff; stroke: #111111; stroke-width: 0.9; }
</style>
<text x="44.0" y="36" class="title">DEPTH-3 SURVEY UPLINK: RETAINED ROUTE OWNER CROSSES THE CHILD SLOT</text>
<line x1="44.0" y1="60.0" x2="44.0" y2="760.0" class="major-line"/>
<line x1="44.0" y1="60.0" x2="4258.0" y2="60.0" class="major-line"/>
<text x="164.0" y="96.0" class="row-label">HEADLESS GUI / BLE</text>
<rect x="284.0" y="74.0" width="953.8" height="36.0" fill="#ffffff" stroke="#111111" stroke-width="1"/>
<text x="760.9" y="91.0" class="small center event-text" text-anchor="middle"><tspan x="760.9" dy="0.0">Starts full survey</tspan><tspan x="760.9" dy="12.0">expects 3 reports</tspan></text>
<rect x="1237.8" y="74.0" width="953.8" height="36.0" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
<text x="1714.6" y="91.0" class="small center event-text" text-anchor="middle" font-weight="700"><tspan x="1714.6" dy="0.0">Receives A + B</tspan><tspan x="1714.6" dy="12.0">exact host receipts</tspan></text>
<rect x="2191.5" y="74.0" width="1589.6" height="36.0" fill="#f5f5f5" stroke="#111111" stroke-width="1"/>
<text x="2986.3" y="97.0" class="small center event-text" text-anchor="middle"><tspan x="2986.3" dy="0.0">Waits for C</tspan></text>
<rect x="3781.1" y="74.0" width="476.9" height="36.0" fill="#f5f5f5" stroke="#111111" stroke-width="1"/>
<text x="4019.6" y="91.0" class="small center event-text" text-anchor="middle"><tspan x="4019.6" dy="0.0">Outer timeout</tspan><tspan x="4019.6" dy="12.0">no pair plan</tspan></text>
<line x1="44.0" y1="124.0" x2="4258.0" y2="124.0" class="major-line"/>
<text x="164.0" y="160.0" class="row-label">GATEWAY</text>
<rect x="284.0" y="138.0" width="715.3" height="36.0" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
<text x="641.7" y="155.0" class="small center event-text" text-anchor="middle" font-weight="700"><tspan x="641.7" dy="0.0">Four bounded</tspan><tspan x="641.7" dy="12.0">survey-control waves</tspan></text>
<rect x="999.3" y="138.0" width="1192.2" height="36.0" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
<text x="1595.4" y="161.0" class="small center event-text" text-anchor="middle" font-weight="700"><tspan x="1595.4" dy="0.0">Accepts A + B reports</tspan></text>
<rect x="2191.5" y="138.0" width="2066.5" height="36.0" fill="#f5f5f5" stroke="#111111" stroke-width="1"/>
<text x="3224.8" y="161.0" class="small center event-text" text-anchor="middle"><tspan x="3224.8" dy="0.0">No C report arrives</tspan></text>
<line x1="44.0" y1="188.0" x2="4258.0" y2="188.0" class="major-line"/>
<text x="164.0" y="224.0" class="row-label">DIRECT A</text>
<rect x="284.0" y="202.0" width="1907.5" height="36.0" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
<text x="1237.8" y="219.0" class="small center event-text" text-anchor="middle" font-weight="700"><tspan x="1237.8" dy="0.0">Direct path delivers</tspan><tspan x="1237.8" dy="12.0">discovery report</tspan></text>
<rect x="2191.5" y="202.0" width="2066.5" height="36.0" fill="#fafafa" stroke="#333333" stroke-width="1"/>
<text x="3224.8" y="225.0" class="small center event-text" text-anchor="middle"><tspan x="3224.8" dy="0.0">Settled</tspan></text>
<line x1="44.0" y1="252.0" x2="4258.0" y2="252.0" class="major-line"/>
<text x="164.0" y="294.0" class="row-label">FORCED1 B - UPSTREAM OWNER</text>
<polygon points="999.3,273.0 1004.3,278.0 999.3,283.0 994.3,278.0" class="diamond"/>
<rect x="284.0" y="282.0" width="715.3" height="36.0" fill="#f5f5f5" stroke="#111111" stroke-width="1"/>
<text x="641.7" y="299.0" class="small center event-text" text-anchor="middle"><tspan x="641.7" dy="0.0">Upstream timing lost</tspan><tspan x="641.7" dy="12.0">old result becomes route waiter</tspan></text>
<rect x="999.3" y="282.0" width="1748.6" height="36.0" fill="#f5f5f5" stroke="#111111" stroke-width="1"/>
<text x="1873.6" y="299.0" class="small center event-text" text-anchor="middle"><tspan x="1873.6" dy="0.0">Waiter retained</tspan><tspan x="1873.6" dy="12.0">route repair + zero-delay churn</tspan></text>
<rect x="2747.9" y="282.0" width="476.9" height="36.0" fill="#f5f5f5" stroke="#111111" stroke-width="1"/>
<text x="2986.3" y="299.0" class="small center event-text" text-anchor="middle"><tspan x="2986.3" dy="0.0">Direct gateway probe</tspan><tspan x="2986.3" dy="12.0">uses first child slot</tspan></text>
<rect x="3224.8" y="282.0" width="1033.2" height="36.0" fill="#f5f5f5" stroke="#111111" stroke-width="1"/>
<text x="3741.4" y="299.0" class="small center event-text" text-anchor="middle"><tspan x="3741.4" dy="0.0">Same waiter still live</tspan><tspan x="3741.4" dy="12.0">through end of capture</tspan></text>
<line x1="999.3" y1="266.0" x2="999.3" y2="278.0" class="hairline"/>
<text x="955.4" y="265.0" class="tiny">live to capture end</text>
<line x1="44.0" y1="328.0" x2="4258.0" y2="328.0" class="major-line"/>
<text x="164.0" y="370.0" class="row-label">FORCED1 B - CHILD SERVICE</text>
<polygon points="2747.9,349.0 2752.9,354.0 2747.9,359.0 2742.9,354.0" class="diamond"/>
<rect x="284.0" y="358.0" width="1669.1" height="36.0" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
<text x="1118.5" y="375.0" class="small center event-text" text-anchor="middle" font-weight="700"><tspan x="1118.5" dy="0.0">Forwards exact survey control</tspan><tspan x="1118.5" dy="12.0">to C</tspan></text>
<rect x="1953.1" y="358.0" width="794.8" height="36.0" fill="#ffffff" stroke="#111111" stroke-width="1"/>
<text x="2350.5" y="375.0" class="small center event-text" text-anchor="middle"><tspan x="2350.5" dy="0.0">Accepts C EVENT_PROPOSE</tspan><tspan x="2350.5" dy="12.0">installs downstream cadence</tspan></text>
<rect x="2747.9" y="358.0" width="794.8" height="36.0" fill="#f5f5f5" stroke="#111111" stroke-width="1"/>
<text x="3145.3" y="381.0" class="small center event-text" text-anchor="middle"><tspan x="3145.3" dy="0.0">No matching report RX</tspan></text>
<rect x="3542.7" y="358.0" width="715.3" height="36.0" fill="#f5f5f5" stroke="#111111" stroke-width="1"/>
<text x="3900.3" y="381.0" class="small center event-text" text-anchor="middle"><tspan x="3900.3" dy="0.0">Route owner continues winning</tspan></text>
<line x1="2747.9" y1="342.0" x2="2747.9" y2="354.0" class="hairline"/>
<text x="2726.7" y="341.0" class="tiny">accepted</text>
<line x1="44.0" y1="404.0" x2="4258.0" y2="404.0" class="major-line"/>
<text x="164.0" y="440.0" class="row-label">FORCED2 C - REPORT OWNER</text>
<rect x="284.0" y="418.0" width="953.8" height="36.0" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
<text x="760.9" y="435.0" class="small center event-text" text-anchor="middle" font-weight="700"><tspan x="760.9" dy="0.0">Rejects hop 0 / 1</tspan><tspan x="760.9" dy="12.0">accepts exact hop 2</tspan></text>
<rect x="1237.8" y="418.0" width="715.3" height="36.0" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
<text x="1595.4" y="435.0" class="small center event-text" text-anchor="middle" font-weight="700"><tspan x="1595.4" dy="0.0">Runs discovery</tspan><tspan x="1595.4" dy="12.0">stages valid report</tspan></text>
<rect x="1953.1" y="418.0" width="794.8" height="36.0" fill="#ffffff" stroke="#111111" stroke-width="1"/>
<text x="2350.5" y="435.0" class="small center event-text" text-anchor="middle"><tspan x="2350.5" dy="0.0">EVENT_PROPOSE retries</tspan><tspan x="2350.5" dy="12.0">about 37 seconds</tspan></text>
<rect x="2747.9" y="418.0" width="476.9" height="36.0" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
<text x="2986.3" y="435.0" class="small center event-text" text-anchor="middle" font-weight="700"><tspan x="2986.3" dy="0.0">Receives EVENT_ACCEPT</tspan><tspan x="2986.3" dy="12.0">commits first TX slot</tspan></text>
<rect x="3224.8" y="418.0" width="1033.2" height="36.0" fill="#ffffff" stroke="#111111" stroke-width="1"/>
<text x="3741.4" y="435.0" class="small center event-text" text-anchor="middle"><tspan x="3741.4" dy="0.0">Keeps report custody</tspan><tspan x="3741.4" dy="12.0">retries remain bounded</tspan></text>
<line x1="44.0" y1="468.0" x2="4258.0" y2="468.0" class="major-line"/>
<text x="164.0" y="510.0" class="row-label">C TO B - CHANNEL 9</text>
<polygon points="3304.2,489.0 3309.2,494.0 3304.2,499.0 3299.2,494.0" class="diamond"/>
<rect x="284.0" y="498.0" width="2463.9" height="36.0" fill="#fafafa" stroke="#333333" stroke-width="1"/>
<text x="1515.9" y="521.0" class="small center event-text" text-anchor="middle"><tspan x="1515.9" dy="0.0">No usable child cadence yet</tspan></text>
<rect x="2747.9" y="498.0" width="476.9" height="36.0" fill="#ffffff" stroke="#111111" stroke-width="1"/>
<text x="2986.3" y="521.0" class="small center event-text" text-anchor="middle"><tspan x="2986.3" dy="0.0">Accepted cadence</tspan></text>
<rect x="3224.8" y="498.0" width="238.4" height="36.0" fill="#f5f5f5" stroke="#111111" stroke-width="1"/>
<text x="3344.0" y="515.0" class="small center event-text" text-anchor="middle"><tspan x="3344.0" dy="0.0">C sends report</tspan><tspan x="3344.0" dy="12.0">B is probing upstream</tspan></text>
<rect x="3463.2" y="498.0" width="794.8" height="36.0" fill="#f5f5f5" stroke="#111111" stroke-width="1"/>
<text x="3860.6" y="515.0" class="small center event-text" text-anchor="middle"><tspan x="3860.6" dy="0.0">C retries at later slots</tspan><tspan x="3860.6" dy="12.0">B records no report RX</tspan></text>
<line x1="3304.2" y1="482.0" x2="3304.2" y2="494.0" class="hairline"/>
<text x="3283.2" y="481.0" class="tiny">missed</text>
<line x1="44.0" y1="544.0" x2="4258.0" y2="544.0" class="major-line"/>
<text x="164.0" y="580.0" class="row-label">EVIDENCE / VERDICT</text>
<rect x="284.0" y="558.0" width="1669.1" height="36.0" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
<text x="1118.5" y="575.0" class="small center event-text" text-anchor="middle" font-weight="700"><tspan x="1118.5" dy="0.0">LIVE PASS</tspan><tspan x="1118.5" dy="12.0">depth-3 downlink + report staging</tspan></text>
<rect x="1953.1" y="558.0" width="1271.7" height="36.0" fill="#f5f5f5" stroke="#111111" stroke-width="1"/>
<text x="2588.9" y="575.0" class="small center event-text" text-anchor="middle"><tspan x="2588.9" dy="0.0">CORRELATED ROOT CAUSE</tspan><tspan x="2588.9" dy="12.0">two live owners share first slot</tspan></text>
<rect x="3224.8" y="558.0" width="556.4" height="36.0" fill="#f5f5f5" stroke="#111111" stroke-width="1"/>
<text x="3502.9" y="575.0" class="small center event-text" text-anchor="middle"><tspan x="3502.9" dy="0.0">LIVE FAIL</tspan><tspan x="3502.9" dy="12.0">C payload never reaches B</tspan></text>
<rect x="3781.1" y="558.0" width="476.9" height="36.0" fill="#ffffff" stroke="#111111" stroke-width="1" stroke-dasharray="3 3"/>
<text x="4019.6" y="575.0" class="small center event-text" text-anchor="middle"><tspan x="4019.6" dy="0.0">NEXT</tspan><tspan x="4019.6" dy="12.0">admission/arbitration regression + HIL</tspan></text>
<line x1="44.0" y1="608.0" x2="4258.0" y2="608.0" class="major-line"/>
<text x="164.0" y="658.0" class="row-label">KEY POINT</text>
<rect x="2011.0" y="620.0" width="520.0" height="68.0" class="box shaded"/>
<text x="2271.0" y="635.0" class="small center" text-anchor="middle"><tspan x="2271.0" dy="0.0">C receives the exact hop-2 survey control, stages a valid report, negotiates a Channel-9</tspan><tspan x="2271.0" dy="12.0">cadence with B, and transmits repeatedly. B had already retained an older gateway-bound result</tspan><tspan x="2271.0" dy="12.0">after losing upstream timing; it accepts C&#x27;s cadence, then its route-repair owner uses the</tspan><tspan x="2271.0" dy="12.0">first child slot and remains live through the capture. The gateway therefore receives A and B,</tspan><tspan x="2271.0" dy="12.0">but never C.</tspan></text>
<line x1="44.0" y1="700.0" x2="4258.0" y2="700.0" class="major-line"/>
<line x1="44.0" y1="726.0" x2="44.0" y2="764.0" class="major-line"/>
