# Core peripherals
CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_ADC=y
CONFIG_ENTROPY_GENERATOR=y

# Local wired data lines are not available on the current hardware. Runtime
# diagnostics use BLE and, for probe-attached bench work, RTT.
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=4
CONFIG_LOG_BACKEND_UART=n
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_PROCESS_THREAD=y
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=1024
CONFIG_LOG_BUFFER_SIZE=4096

# Mesh RX can forward or ACK packets from the system workqueue; keep room for
# relay result/outbound/frame buffers plus driver and logging call frames.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=6144

# Firmware shell/runtime sizing.
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_ASSERT=y
CONFIG_REBOOT=y
CONFIG_POWEROFF=y
CONFIG_PM_DEVICE=y
