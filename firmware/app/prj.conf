# Core peripherals
CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_ADC=y
CONFIG_ENTROPY_GENERATOR=y

# USB-C serial console and verbose prototype logging.
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_CDC_ACM=y
CONFIG_USB_CDC_ACM_LOG_LEVEL_OFF=y
CONFIG_USB_DEVICE_PRODUCT="UWB Prototype"
CONFIG_USB_DEVICE_PID=0x0004
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=n
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=4
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_PROCESS_THREAD=y
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=1024
CONFIG_LOG_BUFFER_SIZE=4096

# Mesh RX can forward or ACK packets from the system workqueue; keep room for
# relay result/outbound/frame buffers plus driver and logging call frames.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=6144

# Firmware shell/runtime sizing.
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_ASSERT=y
CONFIG_REBOOT=y
CONFIG_POWEROFF=y
