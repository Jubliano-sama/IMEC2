# PoC: watchdog and low-power disabled. Keep BLE courtesy for simultaneous clicks.
CONFIG_WATCHDOG=n
CONFIG_HWINFO=y
CONFIG_POWEROFF=n
CONFIG_PM_DEVICE=n

# Clicker-only BLE courtesy side channel.
CONFIG_BT=y
CONFIG_BT_BROADCASTER=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_PRIVACY=n
CONFIG_BT_SCAN_WITH_IDENTITY=y
CONFIG_BT_DEVICE_NAME="IMEC Clicker"
CONFIG_IMEC_CLICKER_SYSTEMON_RETAINED_IDLE=n
CONFIG_IMEC_CLICKER_SYSTEMOFF_IDLE=n
