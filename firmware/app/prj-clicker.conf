CONFIG_WATCHDOG=y
CONFIG_HWINFO=y

# Clicker-only BLE courtesy side channel.
CONFIG_BT=y
CONFIG_BT_BROADCASTER=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_PRIVACY=n
CONFIG_BT_SCAN_WITH_IDENTITY=y
CONFIG_BT_DEVICE_NAME="IMEC Clicker"
CONFIG_IMEC_CLICKER_SYSTEMON_RETAINED_IDLE=y
CONFIG_IMEC_CLICKER_SYSTEMOFF_IDLE=n

# Every clicker-role image emits event/session IDs that cross a reset boundary:
# production and legacy clickers use them for gateway de-duplication, while the
# ML clicker exposes them as UWB/BLE collection correlation keys. Reserve them
# durably before any role accepts input.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NVS=y
CONFIG_NVS_DATA_CRC=y
CONFIG_IMEC_CLICK_EVENT_SEQUENCE_PERSISTENCE=y
