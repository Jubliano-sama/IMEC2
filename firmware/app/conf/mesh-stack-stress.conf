# Opt-in diagnostic overlay for an exact production mesh preset. The base
# diagnostics already emit typed per-thread watermarks, so avoid a second
# analyzer/logger chain in the protocol work context. STACK_SENTINEL cannot
# be combined with the nRF MPU stack guard, so retain hardware protection.
CONFIG_IMEC_STACK_STRESS_DIAGNOSTICS=y
CONFIG_HW_STACK_PROTECTION=y
CONFIG_STACK_CANARIES=y
