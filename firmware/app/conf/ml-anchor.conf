# Deterministic UWB anchor image for ML range-offset data collection.
CONFIG_IMEC_ML_ANCHOR=y
CONFIG_IMEC_ANCHOR_UWB_SCAN_INTERVAL_MS=180

# Temporary bench debug: expose the existing packet/log BLE service on ML anchors
# so a laptop can subscribe to the log characteristic while DS-TWR is tested.
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="IMEC ML Anchor"
CONFIG_BT_MAX_CONN=1
CONFIG_BT_BONDABLE=n
CONFIG_BT_AUTO_PHY_UPDATE=y
CONFIG_BT_DATA_LEN_UPDATE=y
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_COUNT=10
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_LOG_LEVEL_WRN=y

CONFIG_IMEC_GATEWAY_BLE=y
CONFIG_IMEC_GATEWAY_BLE_LOG_BACKEND=y
