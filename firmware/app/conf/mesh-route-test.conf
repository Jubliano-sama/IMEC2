# Isolated mesh-routing test profile. Presets generate the per-device BLE name
# and transmitter enable bit in the build directory.
CONFIG_IMEC_MESH_ROUTE_TEST=y

CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_BONDABLE=n
CONFIG_BT_AUTO_PHY_UPDATE=y
CONFIG_BT_DATA_LEN_UPDATE=y
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_COUNT=10
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_LOG_LEVEL_WRN=y

CONFIG_IMEC_GATEWAY_BLE=y
CONFIG_IMEC_GATEWAY_BLE_LOG_BACKEND=y

CONFIG_UART_CONSOLE=n
CONFIG_LOG_BACKEND_UART=n
CONFIG_IMEC_MESH_ROUTE_TEST_CH5_SCAN_INTERVAL_MS=380
CONFIG_IMEC_MESH_ROUTE_TEST_CH5_SCAN_RX_US=5000

CONFIG_ISR_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=12288
CONFIG_THREAD_NAME=y

CONFIG_LOG_BUFFER_SIZE=8192
CONFIG_KERNEL_LOG_LEVEL_WRN=y
CONFIG_MPU_LOG_LEVEL_WRN=y
CONFIG_SPI_LOG_LEVEL_WRN=y
CONFIG_GPIO_LOG_LEVEL_WRN=y
CONFIG_ADC_LOG_LEVEL_WRN=y
