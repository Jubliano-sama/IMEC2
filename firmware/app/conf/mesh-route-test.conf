# Isolated mesh-routing test profile. Presets generate role-specific BLE and
# transmitter settings in the build directory.
CONFIG_IMEC_MESH_ROUTE_TEST=y

CONFIG_UART_CONSOLE=n
CONFIG_LOG_BACKEND_UART=n
CONFIG_IMEC_MESH_ROUTE_TEST_CH5_SCAN_INTERVAL_MS=380
CONFIG_IMEC_MESH_ROUTE_TEST_CH5_SCAN_RX_US=5000

CONFIG_ISR_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=2048
CONFIG_INIT_STACKS=y
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_NAME=y

CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_KERNEL_LOG_LEVEL_WRN=y
CONFIG_MPU_LOG_LEVEL_WRN=y
CONFIG_SPI_LOG_LEVEL_WRN=y
CONFIG_GPIO_LOG_LEVEL_WRN=y
CONFIG_ADC_LOG_LEVEL_WRN=y
