# Shared connected-routing profile. Presets generate role-specific BLE and
# optional synthetic-transmitter settings in the build directory.
CONFIG_IMEC_MESH_ROUTE_TEST=y

CONFIG_UART_CONSOLE=n
CONFIG_LOG_BACKEND_UART=n

# Production-successor mesh presets retain warnings, errors, and typed
# stack-evidence output by default. The flash-constrained exact gateway preset
# overrides ordinary logs to errors while retaining its independent typed RTT
# evidence. Informational and per-frame debug text belong to explicit
# diagnostic builds and must not consume release flash or perturb radio timing.
CONFIG_LOG_DEFAULT_LEVEL=2
CONFIG_LOG_MAX_LEVEL=2

CONFIG_ISR_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=6144
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=2048
CONFIG_INIT_STACKS=y
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_NAME=y

CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_KERNEL_LOG_LEVEL_WRN=y
CONFIG_MPU_LOG_LEVEL_WRN=y
CONFIG_SPI_LOG_LEVEL_WRN=y
CONFIG_GPIO_LOG_LEVEL_WRN=y
CONFIG_ADC_LOG_LEVEL_WRN=y
