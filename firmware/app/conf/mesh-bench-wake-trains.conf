# Wake-train bench overlay.
#
# Forces every parent-hop uplink through a full channel-5 wake train by
# removing the post-burst click delivery listen window. Layer this on top of
# conf/mesh-two-anchor-click-bench.conf when the run under test is the
# non-participating-parent wake path rather than the participant fast path.
CONFIG_IMEC_CLICK_DELIVERY_PARENT_LISTEN=n
