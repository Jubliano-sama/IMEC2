# Required by the exact-preset stack evidence gate. This emits only typed,
# production-call-path records; it does not add a worker thread or markers.
CONFIG_IMEC_STACK_DIAGNOSTICS=y
CONFIG_INIT_STACKS=y
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_NAME=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_SEGGER_RTT_CUSTOM_LOCKING=y
CONFIG_SEGGER_RTT_MODE_NO_BLOCK_SKIP=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_RTT_BUFFER=1
CONFIG_LOG_BACKEND_RTT_BUFFER_SIZE=384
CONFIG_ISR_STACK_SIZE=8192
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=2048
