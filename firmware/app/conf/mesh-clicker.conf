# Preserve application diagnostics without letting kernel and SPI debug traffic
# interfere with timing-critical wake, discovery, and DS-TWR work.
CONFIG_KERNEL_LOG_LEVEL_WRN=y
CONFIG_SPI_LOG_LEVEL_WRN=y
CONFIG_MPU_LOG_LEVEL_WRN=y
CONFIG_BT_LOG_LEVEL_WRN=y
CONFIG_IMEC_DS_TWR_RTT_DEBUG=y
CONFIG_IMEC_DEDICATED_COMM_WORKQUEUE=y

# Reserve click event/session IDs durably before accepting physical input.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NVS=y
CONFIG_NVS_DATA_CRC=y
CONFIG_IMEC_CLICK_EVENT_SEQUENCE_PERSISTENCE=y
