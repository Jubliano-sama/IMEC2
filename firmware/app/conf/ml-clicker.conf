# BLE-controlled clicker image for ML range-offset data collection.
CONFIG_IMEC_ML_CLICKER=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="IMEC ML Clicker"
CONFIG_BT_MAX_CONN=1
CONFIG_BT_BONDABLE=n
CONFIG_BT_AUTO_PHY_UPDATE=y
CONFIG_BT_DATA_LEN_UPDATE=y
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_COUNT=10
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_LOG_LEVEL_WRN=y

CONFIG_IMEC_GATEWAY_BLE=y
CONFIG_IMEC_GATEWAY_BLE_LOG_BACKEND=y

# Keep the BLE log stream focused on the ML collection path. Low-level Zephyr
# Bluetooth/Kconfig debug output can otherwise flood the BLE log backend and
# hide command/ranging records.
CONFIG_LOG_BUFFER_SIZE=8192
CONFIG_KERNEL_LOG_LEVEL_WRN=y
CONFIG_MPU_LOG_LEVEL_WRN=y
CONFIG_SPI_LOG_LEVEL_WRN=y
CONFIG_GPIO_LOG_LEVEL_WRN=y
CONFIG_ADC_LOG_LEVEL_WRN=y

CONFIG_IMEC_ML_DEFAULT_SAMPLES_PER_ANCHOR=8
CONFIG_IMEC_ML_MAX_ANCHORS=8
CONFIG_IMEC_ML_DISCOVERY_SLOT_COUNT=8

# The ML clicker is GUI-triggered over BLE, not button/sleep driven.
CONFIG_IMEC_CLICKER_SYSTEMOFF_IDLE=n
CONFIG_IMEC_CLICKER_SYSTEMOFF_RAM_RETENTION=n
CONFIG_IMEC_CLICKER_SYSTEMON_RETAINED_IDLE=n
CONFIG_MAIN_STACK_SIZE=8192
