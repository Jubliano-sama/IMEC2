# BLE-only gateway range-test image.
CONFIG_IMEC_GATEWAY_BLE_CONNECTIVITY_TEST=y
CONFIG_BT_DEVICE_NAME="IMEC BLE Range Advertiser"
CONFIG_BT_BROADCASTER=y
CONFIG_BT_OBSERVER=y

# Strip non-BLE runtime hardware paths from the image.
CONFIG_SPI=n
CONFIG_ADC=n
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG_BACKEND_UART=n
CONFIG_LOG_BACKEND_RTT=n
CONFIG_USE_SEGGER_RTT=n
CONFIG_IMEC_CLICKER_SYSTEMOFF_IDLE=n
CONFIG_IMEC_CLICKER_SYSTEMOFF_RAM_RETENTION=n
CONFIG_IMEC_CLICKER_SYSTEMON_RETAINED_IDLE=n
CONFIG_REBOOT=n
CONFIG_PM_DEVICE=n

# Keep enough logging to prove the BLE log notification stream.
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=4
CONFIG_LOG_OUTPUT=y
CONFIG_LOG_PROCESS_THREAD=y
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=1024
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
