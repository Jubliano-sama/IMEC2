CONFIG_ZTEST=y
CONFIG_ZTEST_STACK_SIZE=4096

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
# Exercise worst-case entry capacity from storage erased by suite setup. This
# does not validate an in-place upgrade from records written without data CRC.
CONFIG_NVS_DATA_CRC=y
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y
CONFIG_TEST_RANDOM_GENERATOR=y
